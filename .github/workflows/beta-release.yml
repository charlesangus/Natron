name: Beta Release

on:
  workflow_run:
    workflows: ['Tests']
    types: [completed]

jobs:
  dispatch-beta:
    name: dispatch-beta
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # `main`'s branch protection already requires the Checks workflow (format,
    # lint-ci) and this Tests workflow's build-and-test job to pass before a
    # merge can land, so a green post-merge Tests run implies Checks already
    # passed too. Keying off Tests alone is therefore not a gap; re-checking
    # Checks' conclusion here would just be redundant cross-workflow polling.
    # Revisit only if branch protection on `main` is ever relaxed.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5.0.1
        with:
          # main may have moved on since this Tests run started; the beta must
          # be built from the commit that was actually tested.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Allocate and push next beta tag
        id: next_tag
        # git's atomic ref push is the lock: two concurrent runs can compute
        # the same candidate, but only one push for a given tag name can win,
        # so a loser retries against the now-updated tag set instead of
        # dispatching a release for a tag someone else already claimed.
        #
        # The run id and attempt in the annotation keep two runs tagging the
        # same commit in the same second from producing byte-identical tag
        # objects, where the loser's push would report "up to date" and both
        # would claim the tag. The ls-remote check backs that up: a run only
        # claims the tag if the remote ref holds its own tag object.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for _ in $(seq 1 10); do
            git fetch origin --tags --force
            tag="$(tools/release/next-beta-tag.sh)"
            git tag -a "$tag" "$HEAD_SHA" \
              -m "$tag" -m "Allocated by run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            local_obj="$(git rev-parse "refs/tags/$tag")"
            if git push origin "refs/tags/$tag"; then
              remote_obj="$(git ls-remote origin "refs/tags/$tag" \
                | awk -v ref="refs/tags/$tag" '$2 == ref {print $1}')"
              if [[ "$remote_obj" == "$local_obj" ]]; then
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            git tag -d "$tag"
          done
          echo "::error::Failed to allocate a unique beta tag after 10 attempts" >&2
          exit 1

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag="${{ steps.next_tag.outputs.tag }}"
