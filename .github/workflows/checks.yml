name: Checks

on:
  workflow_dispatch: {}
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: pip install --disable-pip-version-check "clang-format==21.1.8"

      - name: Check clang-format on changed lines
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              base_sha="${{ github.event.pull_request.base.sha }}"
              git fetch --no-tags --quiet origin "$base_sha"
              if base_rev="$(git merge-base "$base_sha" HEAD 2>/dev/null)"; then
                :
              else
                # Unrelated/shallow history: fall back to a direct diff
                # against the PR base instead of crashing or scanning the
                # whole tree.
                base_rev="$base_sha"
              fi
              ;;
            push)
              before_sha="${{ github.event.before }}"
              if [ -n "$before_sha" ] && [ "$before_sha" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
                base_rev="$before_sha"
              elif git rev-parse --verify --quiet "${{ github.sha }}~1" >/dev/null 2>&1; then
                base_rev="${{ github.sha }}~1"
              else
                # Root commit with no parent: diff against the empty tree.
                base_rev="$(git hash-object -t tree /dev/null)"
              fi
              ;;
            workflow_dispatch)
              # Manual runs have no PR/push base to key off of; diff against
              # the merge-base with main so the gate is exercisable by hand
              # from a branch that isn't targeting main yet.
              git fetch --no-tags --quiet origin main
              base_rev="$(git merge-base origin/main HEAD)"
              ;;
            *)
              echo "No base commit for event '${{ github.event_name }}'; nothing to check."
              exit 0
              ;;
          esac

          # Resolve the exact pinned binary instead of trusting PATH order,
          # so git-clang-format can't silently pick up a runner-supplied
          # clang-format of a different major version.
          clang_format_bin="$(python3 -c 'import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), "data", "bin", "clang-format"))')"

          echo "Checking changed C/C++ lines against ${base_rev}"

          # clang-format==21.1.8's git-clang-format already exits non-zero
          # when it finds something to fix, and prints "no modified files to
          # format" / "clang-format did not modify any files" -- not a diff
          # -- when it doesn't; verified directly against this pin. Its exit
          # code is the verdict, so we only need to let the diff it prints
          # reach the log.
          # Documentation/templates/*.c are not buildable C despite the
          # extension: they're hand-maintained verbatim snapshots of the
          # HTML that Engine/ emits as string literals, kept so a human can
          # diff them against those literals. Reformatting would destroy
          # that verbatim property, so exclude the directory via pathspec.
          set +e
          git clang-format --binary "$clang_format_bin" \
            --extensions c,cc,cpp,h,hpp,mm \
            --diff "$base_rev" \
            -- . ':(exclude)Documentation/templates/'
          status=$?
          set -e

          exit "$status"

  lint-ci:
    name: lint-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail

          version="0.10.0"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          sha256="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"

          tmp="$(mktemp -d)"
          curl -sSL -o "${tmp}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "${sha256}  ${tmp}/${archive}" | sha256sum -c -

          tar xf "${tmp}/${archive}" -C "${tmp}"
          sudo install -m 0755 "${tmp}/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "${tmp}"

          shellcheck --version

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail

          version="1.7.12"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          sha256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

          tmp="$(mktemp -d)"
          curl -sSL -o "${tmp}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha256}  ${tmp}/${archive}" | sha256sum -c -

          tar xf "${tmp}/${archive}" -C "${tmp}" actionlint
          sudo install -m 0755 "${tmp}/actionlint" /usr/local/bin/actionlint
          rm -rf "${tmp}"

          actionlint -version

      - name: shellcheck tools/ci/local
        shell: bash
        run: |
          set -euo pipefail
          shellcheck tools/ci/local/*.sh

      - name: actionlint workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint .github/workflows/*.yml
