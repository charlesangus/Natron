name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-vfxall:2027-clang21.1
    defaults:
      run:
        shell: bash -l {0}
    env:
      CI: 'True'
      # Declaration-only: nothing in this repo reads PYTHON_VERSION
      # (CMakeLists.txt uses find_package(Python3 ...), which picks up
      # whatever Python3 is on PATH in the image). It mirrors
      # devshell.sh's local value and the image's own CPython
      # (ASWF_CPYTHON_VERSION=3.13.14) so it doesn't mislead a reader who
      # assumes changing it changes the build.
      PYTHON_VERSION: '3.13'
      OCIO_CONFIG_VERSION: 2.5
      NATRON_IN_CONTAINER: 1
      # CCACHE_DIR: deliberately under the checked-out workspace, NOT
      # ccache's built-in default ($HOME/.cache/ccache in this image).
      # `container:` jobs run as root but the runner does not guarantee
      # HOME matches the image's /root -- it may repoint it at a
      # job-managed volume. github.workspace is bind-mounted at the same
      # absolute path inside the container, so it is a stable, cacheable
      # path whatever HOME resolves to. build.sh/test.sh never set
      # CCACHE_DIR themselves (they only pass
      # -DCMAKE_*_COMPILER_LAUNCHER=ccache), so this value flows straight
      # through to the compiler-launcher ccache invocations.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # CCACHE_MAXSIZE: ccache's built-in 5 GiB default was measured to
      # thrash on a single cold build of this repo -- 193 cleanup cycles
      # and a 0.18% hit rate, because one full debug build's object
      # working set exceeds 5 GiB before the build finishes. Do not copy
      # devshell.sh's local 40G: that is sized to hold several build
      # trees across branch switches, while actions/cache has a 10 GB
      # total-per-repository quota and the restore-key design below
      # intentionally keeps more than one entry alive (this branch's and
      # main's). 6 GiB clears the observed thrashing point while leaving
      # room under the quota for a second entry to coexist. If the
      # end-of-job `ccache -s` keeps reporting cleanups, raise this
      # first.
      CCACHE_MAXSIZE: 6G

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive

      # Cache key design:
      #
      #   key (primary):    ccache-linux-<branch>-<run_id>
      #   restore-keys:     ccache-linux-<branch>-
      #                     ccache-linux-main-
      #
      # <branch> is `github.head_ref || github.ref_name`: on pull_request
      # events github.ref_name is the synthetic "<pr-number>/merge" ref,
      # which is not a stable per-branch prefix across runs of the same
      # PR, so head_ref -- the PR's actual source branch -- is used
      # instead; on push events head_ref is unset and it falls back to
      # ref_name, i.e. "main".
      #
      # The primary key always ends in github.run_id, so it (almost)
      # never matches an existing cache on restore. That is intentional:
      # actions/cache's save is a silent no-op if an entry already exists
      # under the exact key, so a run-unique primary key guarantees this
      # run's ccache state is saved as a *new* entry instead of being
      # dropped because an earlier run claimed the key. Every real hit
      # comes from restore-keys, which prefix-match the most recently
      # created matching entry:
      #   1. ccache-linux-<branch>-  -> this branch's own last run, so an
      #      Nth push to a PR reuses the previous push's warm cache.
      #   2. ccache-linux-main-      -> main's last run, so the first run
      #      on a brand-new branch starts warm instead of cold.
      # A merge to main saves a fresh "ccache-linux-main-<run_id>" entry,
      # which becomes the newest match for every later lookup -- that is
      # how main's cache refreshes without anything ever being explicitly
      # deleted.
      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ github.head_ref || github.ref_name }}-
            ccache-linux-main-

      # build/assets is not just downloads: fetch-assets.sh compiles the
      # openfx-io plugin bundle from pinned source (see that script's
      # header for why the prebuilt one can't be used), and the BaseTest
      # ctest cases fail without it. Caching turns the fetch step into a
      # stamp check on a hit instead of a few minutes of cmake per run.
      #
      # Keyed on fetch-assets.sh's own hash, which covers BOTH the pinned
      # SHAs and the build recipe -- change either and the cache
      # correctly misses and rebuilds. Only the two output dirs are
      # cached, not build/assets in full: plugin-src/ is 62 MB of
      # checkouts and object files needed solely to *produce* Plugins/,
      # and nothing reads it on a hit. The cached pair is ~52 MB,
      # negligible against the 10 GB per-repo quota the ccache entries
      # above have to live within.
      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/OpenColorIO-Configs
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      # --no-ccache-stats suppresses build.sh's own end-of-build
      # `ccache -s` so the summary isn't printed twice. The "ccache
      # stats" step below is the single canonical place it's printed, and
      # unlike build.sh's inline print it still runs when the build or
      # tests fail -- which is exactly when you want to know whether
      # ccache was in play.
      - name: Build (debug)
        run: tools/ci/local/build.sh debug --no-ccache-stats

      - name: Run ctest suite (debug)
        run: tools/ci/local/test.sh ctest debug

      - name: Python bindings smoke test (debug)
        run: tools/ci/local/test.sh smoke debug

      # if: always() is load-bearing: a step defaults to success() and is
      # skipped once an earlier step has failed, so without it a red build
      # would compile objects into ccache and then never save them, and
      # the fix-and-push run that recompiles almost the same tree would
      # start cold. Plain actions/cache is no alternative -- its implicit
      # post-job save is declared post-if: success() and drops the cache
      # on a red run too, which is why restore and save are separate steps
      # here. Removing this fails nothing loudly; CI just gets slow.
      #
      # key reuses the restore step's resolved cache-primary-key output
      # rather than re-interpolating the expression, so restore and save
      # can never drift apart.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s
