name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
    - RB-2.5
    - RB-2.6
    paths-ignore:
      - Documentation
  pull_request:
    branches:
    - RB-2.5
    - RB-2.6
    paths-ignore:
      - Documentation

jobs:
  unix_test:
    name: Test Ubuntu Python 3.10
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-baseqt:2027.0
    defaults:
      run:
        shell: xvfb-run --auto-servernum bash -l {0}
    env:
      CI: 'True'
      PYTHON_VERSION: '3.10'
      OCIO_CONFIG_VERSION: 2.5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install Linux system packages
        shell: bash
        run: |
          dnf install -y cairo-devel epel-release wget unzip clang xorg-x11-server-Xvfb
          dnf install -y extra-cmake-modules

      - name: Download OpenColorIO-Configs
        run: |
          wget https://github.com/NatronGitHub/OpenColorIO-Configs/archive/Natron-v${OCIO_CONFIG_VERSION}.tar.gz
          tar xzf Natron-v${OCIO_CONFIG_VERSION}.tar.gz
          mv OpenColorIO-Configs-Natron-v${OCIO_CONFIG_VERSION} OpenColorIO-Configs

      - name: Download Plugins
        run: |
          mkdir Plugins && cd Plugins
          wget https://github.com/NatronGitHub/openfx-io/releases/download/natron_testing/openfx-io-build-ubuntu_22-testing.zip
          unzip openfx-io-build-ubuntu_22-testing.zip
          cd ..

      - name: Build Unix (debug)
        run: |
          mkdir debug && cd debug
          cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=/usr/local ../
          make -j2

      - name: Run Unix Tests (debug)
        id: run-unix-tests-debug
        # Allow continuing after error so logs can be uploaded.
        continue-on-error: true
        run: |
          cd debug
          OFX_PLUGIN_PATH=$PWD/../Plugins OCIO=$PWD/../OpenColorIO-Configs/blender/config.ocio ctest -V

      - name: Python bindings smoke test (debug)
        id: python-smoke-test-debug
        # Allow continuing after error so later steps (release build/tests,
        # log upload) still run; failure is aggregated below like the ctest
        # steps above.
        continue-on-error: true
        run: |
          cd debug
          NATRON_RENDERER=$(find . -maxdepth 4 -type f -name NatronRenderer | head -n1)
          if [ -z "$NATRON_RENDERER" ]; then
            echo "Could not find a built NatronRenderer binary under debug/" >&2
            exit 1
          fi
          echo "Using NatronRenderer: $NATRON_RENDERER"
          OFX_PLUGIN_PATH=$PWD/../Plugins OCIO=$PWD/../OpenColorIO-Configs/blender/config.ocio \
            "$NATRON_RENDERER" "$PWD/../tools/ci/smoke_test.py"

      - name: Build Unix (release)
        run: |
          mkdir release && cd release
          cmake -DCMAKE_PREFIX_PATH=/usr/local ../
          make -j2

      - name: Run Unix Tests (release)
        id: run-unix-tests-release
        # Allow continuing after error so logs can be uploaded.
        continue-on-error: true
        run: |
          cd release
          OFX_PLUGIN_PATH=$PWD/../Plugins OCIO=$PWD/../OpenColorIO-Configs/blender/config.ocio ctest -V

      - name: Upload Ubuntu Test Log artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Ubuntu Test Logs
          path: ${{ github.workspace }}/release/Testing/Temporary/LastTest.log

      - name: Report step outcomes (temporary M2.P3.T1a diagnostic)
        if: always()
        run: |
          echo "::notice::run-unix-tests-debug.outcome=${{ steps.run-unix-tests-debug.outcome }}"
          echo "::notice::python-smoke-test-debug.outcome=${{ steps.python-smoke-test-debug.outcome }}"
          echo "::notice::run-unix-tests-release.outcome=${{ steps.run-unix-tests-release.outcome }}"

      - name: Check for test failures
        if: steps.run-unix-tests-debug.outcome == 'failure' || steps.run-unix-tests-release.outcome == 'failure' || steps.python-smoke-test-debug.outcome == 'failure'
        run: exit 1
