name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

concurrency:
  # Only PR runs share a group, so a newer push supersedes an older one.
  # Every other run gets a group of its own: a shared group holds just one
  # pending run and silently replaces it, which would drop a merge to main
  # from beta-release.yml's workflow_run trigger and skip its beta.
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dev-image:
    name: dev image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dev-image.yml

  # Builds once; the ctest legs below run off the build tree it uploads.
  build:
    name: build (debug)
    needs: dev-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CI: 'True'
      # Declaration-only: nothing in this repo reads PYTHON_VERSION
      # (CMakeLists.txt uses find_package(Python3 ...), which picks up
      # whatever Python3 is on PATH in the image). It mirrors
      # devshell.sh's local value and the image's own CPython
      # (ASWF_CPYTHON_VERSION=3.13.14) so it doesn't mislead a reader who
      # assumes changing it changes the build.
      PYTHON_VERSION: '3.13'
      OCIO_CONFIG_VERSION: 2.5
      NATRON_IN_CONTAINER: 1
      # CCACHE_DIR: deliberately under the checked-out workspace, NOT
      # ccache's built-in default ($HOME/.cache/ccache in this image).
      # `container:` jobs run as root but the runner does not guarantee
      # HOME matches the image's /root -- it may repoint it at a
      # job-managed volume. github.workspace is bind-mounted at the same
      # absolute path inside the container, so it is a stable, cacheable
      # path whatever HOME resolves to. build.sh/test.sh never set
      # CCACHE_DIR themselves (they only pass
      # -DCMAKE_*_COMPILER_LAUNCHER=ccache), so this value flows straight
      # through to the compiler-launcher ccache invocations.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # CCACHE_MAXSIZE: ccache's built-in 5 GiB default thrashed on a
      # cold debug build (193 cleanup cycles, 0.18% hit rate). Saved
      # debug entries are ~1.7-2.1 GB, and actions/cache has a 10 GB
      # per-repository quota shared with the release and fast families
      # (3G + 3G + 2G caps) plus per-branch entries, so this is held at
      # 3G. If the end-of-job `ccache -s` keeps reporting cleanups,
      # raise this first.
      CCACHE_MAXSIZE: 3G
      # One compile per vCPU of the hosted runner; build.sh's default of 3 suits the dev machine.
      NATRON_BUILD_JOBS: 4

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive

      # Cache key design:
      #
      #   key (primary):    ccache-linux-debug-<branch>-<run_id>
      #   restore-keys:     ccache-linux-debug-<branch>-
      #                     ccache-linux-debug-main-
      #                     ccache-linux-main-
      #
      # <branch> is `github.head_ref || github.ref_name`: on pull_request
      # events github.ref_name is the synthetic "<pr-number>/merge" ref,
      # which is not a stable per-branch prefix across runs of the same
      # PR, so head_ref -- the PR's actual source branch -- is used
      # instead; on push events head_ref is unset and it falls back to
      # ref_name, i.e. "main".
      #
      # The primary key always ends in github.run_id, so it (almost)
      # never matches an existing cache on restore. That is intentional:
      # actions/cache's save is a silent no-op if an entry already exists
      # under the exact key, so a run-unique primary key guarantees this
      # run's ccache state is saved as a *new* entry instead of being
      # dropped because an earlier run claimed the key. Every real hit
      # comes from restore-keys, which prefix-match the most recently
      # created matching entry:
      #   1. ccache-linux-debug-<branch>-  -> this branch's own last run,
      #      so an Nth push to a PR reuses the previous push's warm cache.
      #   2. ccache-linux-debug-main-      -> main's last run, so the first
      #      run on a brand-new branch starts warm instead of cold.
      #   3. ccache-linux-main-            -> the pre-preset main entries;
      #      only matters until the first debug-main entry exists.
      # A merge to main saves a fresh "ccache-linux-debug-main-<run_id>" entry,
      # which becomes the newest match for every later lookup -- that is
      # how main's cache refreshes without anything ever being explicitly
      # deleted.
      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-debug-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-debug-${{ github.head_ref || github.ref_name }}-
            ccache-linux-debug-main-
            ccache-linux-main-

      # build/assets is not just downloads: fetch-assets.sh compiles the
      # openfx-io plugin bundle from pinned source (see that script's
      # header for why the prebuilt one can't be used), and the BaseTest
      # ctest cases fail without it. Caching turns the fetch step into a
      # stamp check on a hit instead of a few minutes of cmake per run.
      #
      # Keyed on fetch-assets.sh's own hash, which covers BOTH the pinned
      # SHAs and the build recipe -- change either and the cache
      # correctly misses and rebuilds. Only the output dir is
      # cached, not build/assets in full: plugin-src/ is 62 MB of
      # checkouts and object files needed solely to *produce* Plugins/,
      # and nothing reads it on a hit. The cached dir is ~52 MB,
      # negligible against the 10 GB per-repo quota the ccache entries
      # above have to live within.
      #
      # build/assets/CImg holds the one plugin-src file the tests read
      # (CImg.h, the reference the native kernels are checked against), so
      # it must be cached alongside Plugins/.
      #
      # build/assets/rawspeed is the installed rawspeed (static library,
      # headers, cameras.xml) the Natron build links, built by its own
      # stamped step, so a hit skips that compile too.
      #
      # build/assets/onnxruntime is the unpacked ONNX Runtime CPU release
      # whose headers the build includes and whose library the bundle ships.
      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/TestPlugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      # --no-ccache-stats suppresses build.sh's own end-of-build
      # `ccache -s` so the summary isn't printed twice. The "ccache
      # stats" step below is the single canonical place it's printed, and
      # unlike build.sh's inline print it still runs when the build or
      # tests fail -- which is exactly when you want to know whether
      # ccache was in play.
      - name: Build (debug)
        run: tools/ci/local/build.sh debug --no-ccache-stats

      # A tar because artifacts drop the executable bit. Object files and static archives are
      # only build inputs.
      - name: Pack build tree
        run: |
          tar -cf build-tree.tar --exclude='*.o' --exclude='*.a' build/debug
          ls -lh build-tree.tar

      - name: Upload build tree
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-tree-debug
          path: build-tree.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      # if: always() is load-bearing: a step defaults to success() and is
      # skipped once an earlier step has failed, so without it a red build
      # would compile objects into ccache and then never save them, and
      # the fix-and-push run that recompiles almost the same tree would
      # start cold. Plain actions/cache is no alternative -- its implicit
      # post-job save is declared post-if: success() and drops the cache
      # on a red run too, which is why restore and save are separate steps
      # here. Removing this fails nothing loudly; CI just gets slow.
      #
      # key reuses the restore step's resolved cache-primary-key output
      # rather than re-interpolating the expression, so restore and save
      # can never drift apart.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s

  ctest:
    name: ctest (${{ matrix.scheduler }})
    needs: [dev-image, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheduler: [legacy, taskgraph]
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CI: 'True'
      PYTHON_VERSION: '3.13'
      OCIO_CONFIG_VERSION: 2.5
      NATRON_IN_CONTAINER: 1

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The build job saved both entries, so these hit and fetch-assets.sh is a stamp check.
      - name: Restore test assets
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/TestPlugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Download build tree
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-tree-debug

      # The tree's absolute paths hold because every job's workspace is mounted at the same path.
      - name: Unpack build tree
        run: |
          tar -xf build-tree.tar
          rm build-tree.tar

      # lavapipe is the CPU Vulkan device; without it the Gpu tests would
      # skip silently, so REQUIRE_GPU turns that into a failure.
      - name: Run ctest suite (debug)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          NATRON_TEST_REQUIRE_GPU: 1
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          # One case per vCPU of the hosted runner; 1 restores the serial `ctest -V` run.
          NATRON_CTEST_JOBS: 4
        run: |
          grep -m1 'model name' /proc/cpuinfo; nproc; grep -o -w 'avx512f' /proc/cpuinfo | head -1 || true
          tools/ci/local/test.sh ctest debug

      - name: Python bindings smoke test (debug)
        if: success() || failure()
        env:
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          NATRON_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/build/smoke-reference
        run: tools/ci/local/test.sh smoke debug

      - name: Upload smoke renders
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-render-${{ matrix.scheduler }}
          path: build/smoke-reference
          if-no-files-found: ignore
          retention-days: 1

  # Branch protection requires a check named exactly `build-and-test`; the
  # matrix legs are named `ctest (<scheduler>)`, so this job keeps the
  # required name stable. It also holds the byte-for-byte comparison of the
  # two schedulers' smoke renders, which can no longer happen inside one job.
  build-and-test:
    name: build-and-test
    needs: [build, ctest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every ctest leg to pass
        env:
          RESULT: ${{ needs.ctest.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "ctest matrix result: $RESULT" >&2
            exit 1
          fi

      - name: Download smoke renders
        uses: actions/download-artifact@v4
        with:
          pattern: smoke-render-*
          path: smoke-renders

      - name: Compare smoke renders across schedulers
        run: |
          test -d smoke-renders/smoke-render-legacy
          test -d smoke-renders/smoke-render-taskgraph
          diff -r smoke-renders/smoke-render-legacy smoke-renders/smoke-render-taskgraph
