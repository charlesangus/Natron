name: Nightly

# The PR gate (ci.yml) is deliberately a fast smoke check: debug build +
# ctest only, so a PR gets a signal in minutes. This workflow runs the
# fuller, slower suite that gate intentionally skips -- release build,
# release ctest, and the Python bindings smoke test -- on a cadence where
# minutes don't matter: after every push to main (so a regression that
# only shows up in a release build or in the smoke test is caught close to
# the merge that caused it) and once a night as a standing backstop (so a
# regression is never silently missed if, say, main goes a while between
# pushes). workflow_dispatch is included so it can also be run on demand,
# e.g. to re-check main after fixing something this workflow flagged.
#
# Named "nightly" rather than "post-merge" because the nightly schedule is
# what makes this workflow load-bearing on its own, independent of push
# activity on main -- the push-to-main trigger is a (very useful) bonus,
# not the defining trigger.
#
# This is intentionally NOT a merge gate: it is not wired into branch
# protection / required status checks (that is M8.P3.T1's scope, and it
# applies only to the PR gate in ci.yml). A red run here should surface a
# problem, not block anyone's merge.

on:
  push:
    branches:
    - main
    paths-ignore:
      - Documentation
  schedule:
    # 03:17 UTC: outside the well-documented top-of-hour/half-hour pile-up
    # on GitHub's shared cron fleet (scheduled workflows are best-effort and
    # can be delayed further under load -- an odd, off-peak minute doesn't
    # eliminate that, just avoids adding to the busiest slots), and in the
    # dead of night for the project's US/EU-hours contributors, so a delay
    # of this run doesn't compete with anyone's working day.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  nightly_release:
    name: Release build, tests, and smoke test (Linux)
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-vfxall:2027-clang21.1
    defaults:
      run:
        shell: bash -l {0}
    env:
      CI: 'True'
      NATRON_IN_CONTAINER: 1
      # --- ccache -------------------------------------------------------
      # Same reasoning as ci.yml: CCACHE_DIR is pinned under
      # github.workspace (stable across whatever HOME resolves to in a
      # container: job), and build.sh/test.sh never set it themselves, so
      # this job-level value flows straight through to ccache.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # CCACHE_MAXSIZE: same 6 GiB figure ci.yml measured as comfortably
      # above one full build's working set while leaving headroom under
      # GitHub's 10 GB per-repository actions/cache quota for the debug
      # cache entries ci.yml maintains to coexist (see ci.yml's env block
      # for the full measurement notes). This job's cache uses its own
      # "release" key prefix below, so it doesn't evict or get evicted by
      # ci.yml's debug entries.
      CCACHE_MAXSIZE: 6G

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      # Cache key design mirrors ci.yml's (see its comments for the full
      # walkthrough of restore-key prefix matching); the only change is a
      # "release" segment so this job's ccache entries never collide with,
      # evict, or get evicted by ci.yml's debug-build entries. This
      # workflow only ever builds the "main" ref (push-to-main, the
      # nightly schedule runs against the default branch, and
      # workflow_dispatch defaults to it too), so there is no per-PR
      # branch scenario to cover here the way ci.yml has -- just "warm
      # from last time" via the trailing restore-key.
      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-release-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-release-${{ github.ref_name }}-

      # build/assets is no longer just downloads: fetch-assets.sh now compiles
      # the openfx-io plugin bundle from source (see that script's header for
      # why the prebuilt one can't be used). Caching it turns the step below
      # into a stamp check on a hit, instead of a few minutes of cmake per run.
      #
      # Keyed on fetch-assets.sh's own hash, which covers BOTH pinned SHAs and
      # the build recipe -- change either and the cache correctly misses and
      # rebuilds. Only the two output dirs are cached, not build/assets in
      # full: plugin-src/ is 62 MB of checkouts and object files needed solely
      # to *produce* Plugins/, and on a cache hit nothing reads it. The cached
      # pair is ~52 MB, negligible against the 10 GB per-repo actions/cache
      # quota that the ccache entries above actually have to live within.
      - name: Cache test assets
        uses: actions/cache@v4
        with:
          path: |
            build/assets/Plugins
            build/assets/OpenColorIO-Configs
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      # No continue-on-error here, deliberately: a release-build failure is
      # a real failure and must turn the job red on its own, not be
      # papered over. (As of this writing, main does not yet compile under
      # Qt6 -- M2's scope, not this workflow's -- so this step is expected
      # to fail until that lands. That is a correct, informative red, not a
      # bug in this pipeline.) Because this step has no continue-on-error,
      # its failure also means the two test steps below -- which need a
      # successful build to have anything to run -- are skipped
      # automatically; the aggregating step further down accounts for that.
      - name: Build Unix (release)
        run: tools/ci/local/build.sh release --no-ccache-stats

      # --- test steps ------------------------------------------------------
      # Both use continue-on-error: true, the same pattern the old workflow
      # used for its test steps: ctest and the smoke test are independent
      # signals, and a failure in one should not prevent the other from
      # running and reporting its own result. "Check test results" below is
      # the step that turns any real failure back into a red job -- without
      # it, continue-on-error would silently swallow failures.
      - name: Run Unix Tests (release)
        id: run_ctest
        continue-on-error: true
        run: tools/ci/local/test.sh ctest release

      - name: Python bindings smoke test (release)
        id: run_smoke
        continue-on-error: true
        run: tools/ci/local/test.sh smoke release

      # if: always() so this uploads whenever the log exists, including
      # when a prior step failed -- that is precisely when the log is
      # wanted most. (The old workflow's version of this step lacked
      # if: always(), so it silently produced nothing on the failure path
      # it was meant for.) if-no-files-found stays at its default ("warn")
      # rather than "error": the log legitimately won't exist if the build
      # itself failed before ctest ever ran, and that's not a separate
      # failure to report on top of the build step already being red.
      - name: Upload ctest log artifact
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Linux Release Test Logs
          path: ${{ github.workspace }}/build/release/Testing/Temporary/LastTest.log

      # if: always() is load-bearing, not decorative -- see ci.yml's Save
      # ccache step for the full rationale. Short version: actions/cache's
      # implicit post-job save only runs when the job succeeds, so without
      # if: always() a failing release build (expected until M2 lands --
      # see the Build Unix (release) step above) would compile objects into
      # ccache and then throw all of it away every single run. key reuses
      # restore_ccache's resolved cache-primary-key output rather than
      # re-interpolating the key expression here, so restore and save can
      # never drift apart into different keys.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s

      # Aggregates the two continue-on-error test steps. Their outcome is
      # one of "success", "failure", or "skipped" (skipped happens when the
      # release build above failed, since neither test step has its own
      # if: always()) -- only "failure" is treated as this step's failure.
      # "skipped" is deliberately not an error here: the job is already red
      # because of the build step's own (non-continue-on-error) failure, so
      # this step doesn't need to fail it a second time for tests that
      # never got a chance to run.
      - name: Check test results
        if: always()
        run: |
          status=0

          echo "ctest outcome: ${{ steps.run_ctest.outcome }}"
          if [[ "${{ steps.run_ctest.outcome }}" == "failure" ]]; then
            echo "::error::ctest (release) failed"
            status=1
          fi

          echo "smoke test outcome: ${{ steps.run_smoke.outcome }}"
          if [[ "${{ steps.run_smoke.outcome }}" == "failure" ]]; then
            echo "::error::Python bindings smoke test (release) failed"
            status=1
          fi

          exit "${status}"
