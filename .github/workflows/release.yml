name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0-beta1)'
        required: true
        type: string

concurrency:
  # Keyed on the tag, not github.ref: every workflow_dispatch run shares the
  # same ref (main), so a ref-keyed group would serialize distinct betas and
  # drop all but the most recently dispatched one.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build-and-release
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-vfxall:2027-clang21.1
    defaults:
      run:
        shell: bash -l {0}
    env:
      CI: 'True'
      NATRON_IN_CONTAINER: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      NATRON_DEPS_CACHE: ${{ github.workspace }}/.natron-deps
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      - name: Resolve dispatch tag
        if: github.event_name == 'workflow_dispatch'
        # A dispatch always checks out main, but beta-release.yml tags the
        # commit its Tests run passed on, which main may have moved past.
        # An existing tag therefore has to be checked out, submodules
        # included, so the build matches the tag. Only a tag that doesn't
        # exist yet is created, at the checked-out HEAD.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
            git checkout --force --detach "refs/tags/$TAG"
            git submodule sync --recursive
            git submodule update --init --force --recursive
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
          echo "Building $TAG at $(git rev-parse HEAD)"

      # The ASWF base image has no git-lfs; the dev image bakes in the same pin.
      - name: Install git-lfs
        run: tools/ci/local/install-git-lfs.sh

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-release-tag-${{ env.TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-release-tag-${{ env.TAG }}-

      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      # The pinned Slang release is downloaded at configure time; the
      # key hashes FetchSlang.cmake, so a version or SHA bump misses.
      - name: Cache Slang
        uses: actions/cache@v6.1.0
        with:
          path: .natron-deps
          key: natron-deps-linux-${{ hashFiles('cmake/FetchSlang.cmake') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Build (release)
        run: tools/ci/local/build.sh release --no-ccache-stats

      - name: Run ctest suite (release)
        id: run_ctest
        continue-on-error: true
        run: tools/ci/local/test.sh ctest release

      - name: Python bindings smoke test (release)
        id: run_smoke
        continue-on-error: true
        run: tools/ci/local/test.sh smoke release

      - name: Check test results
        if: always()
        run: |
          status=0

          echo "ctest outcome: ${{ steps.run_ctest.outcome }}"
          if [[ "${{ steps.run_ctest.outcome }}" == "failure" ]]; then
            echo "::error::ctest (release) failed"
            status=1
          fi

          echo "smoke test outcome: ${{ steps.run_smoke.outcome }}"
          if [[ "${{ steps.run_smoke.outcome }}" == "failure" ]]; then
            echo "::error::Python bindings smoke test (release) failed"
            status=1
          fi

          exit "${status}"

      - name: Stage bundle
        run: tools/release/stage-bundle.sh build/release /tmp/natron-stage

      - name: Create tarball
        run: tools/release/make-tarball.sh /tmp/natron-stage /tmp/artifacts

      - name: Create AppImage
        run: tools/release/make-appimage.sh /tmp/natron-stage /tmp/artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Natron Release Artifacts
          path: /tmp/artifacts/*

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s

  publish:
    name: publish-release
    needs: release
    # No container here: the release job's image has no `gh` CLI, but the
    # hosted runner does.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Natron Release Artifacts
          path: /tmp/artifacts

      - name: Create GitHub Release
        run: |
          prerelease_flag=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG" /tmp/artifacts/* --repo "$GITHUB_REPOSITORY" --title "Natron $TAG" --generate-notes "${prerelease_flag[@]}"
