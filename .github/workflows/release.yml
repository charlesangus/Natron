name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0-beta1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build-and-release
    runs-on: ubuntu-latest
    container:
      image: aswf/ci-vfxall:2027-clang21.1
    defaults:
      run:
        shell: bash -l {0}
    env:
      CI: 'True'
      NATRON_IN_CONTAINER: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 6G
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive

      - name: Create and push dispatch tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-release-tag-${{ env.TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-release-tag-${{ env.TAG }}-

      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/OpenColorIO-Configs
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Build (release)
        run: tools/ci/local/build.sh release --no-ccache-stats

      - name: Run ctest suite (release)
        id: run_ctest
        continue-on-error: true
        run: tools/ci/local/test.sh ctest release

      - name: Python bindings smoke test (release)
        id: run_smoke
        continue-on-error: true
        run: tools/ci/local/test.sh smoke release

      - name: Check test results
        if: always()
        run: |
          status=0

          echo "ctest outcome: ${{ steps.run_ctest.outcome }}"
          if [[ "${{ steps.run_ctest.outcome }}" == "failure" ]]; then
            echo "::error::ctest (release) failed"
            status=1
          fi

          echo "smoke test outcome: ${{ steps.run_smoke.outcome }}"
          if [[ "${{ steps.run_smoke.outcome }}" == "failure" ]]; then
            echo "::error::Python bindings smoke test (release) failed"
            status=1
          fi

          exit "${status}"

      - name: Stage bundle
        run: tools/release/stage-bundle.sh build/release /tmp/natron-stage

      - name: Create tarball
        run: tools/release/make-tarball.sh /tmp/natron-stage /tmp/artifacts

      - name: Create AppImage
        run: tools/release/make-appimage.sh /tmp/natron-stage /tmp/artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Natron Release Artifacts
          path: /tmp/artifacts/*

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s

  publish:
    name: publish-release
    needs: release
    # No container here: the release job's image has no `gh` CLI, but the
    # hosted runner does.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Natron Release Artifacts
          path: /tmp/artifacts

      - name: Create GitHub Release
        run: |
          prerelease_flag=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG" /tmp/artifacts/* --repo "$GITHUB_REPOSITORY" --title "Natron $TAG" --generate-notes "${prerelease_flag[@]}"
