name: Remote build

# The "what ran" part is format('build{0}{1}{2}{3}{4}', ...) where each
# conditional fragment carries its own leading ", ", so no trailing separator
# can appear. A from_run dispatch builds nothing and replaces the list.
run-name: ${{ github.event_name == 'push' && format('Remote build · fast · {0} (cache warm)', github.ref_name) || format('Remote build · {0} · {1}{2}{3}', inputs.preset, inputs.from_run != '' && format('GUI only (from run {0})', inputs.from_run) || format('build{0}{1}{2}{3}{4}', inputs.tests && ', tests' || '', inputs.appimage && ', AppImage' || '', inputs.gui_scripts != '' && ', GUI' || '', inputs.record_goldens && ', goldens' || '', inputs.cmake_args != '' && format(', cmake:{0}', inputs.cmake_args) || ''), inputs.label != '' && format(' · {0}', inputs.label) || '', inputs.token != '' && format(' · {0}', inputs.token) || '') }}

on:
  # A push run builds fast with no tests and no AppImage; it exists to
  # keep main's fast ccache entry warm for branch runs to fall back on.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preset:
        description: 'Build preset'
        required: true
        type: choice
        options:
          - fast
          - release
          - debug
        default: fast
      tests:
        description: 'Run the ctest suite and smoke test'
        required: true
        type: boolean
        default: false
      record_goldens:
        description: 'Record the native golden renders (needs tests) and upload them'
        required: false
        type: boolean
        default: false
      appimage:
        description: 'Package and upload an AppImage (ignored for debug, which cannot be packaged in the container)'
        required: true
        type: boolean
        default: true
      shuffle_seeds:
        description: 'Comma-separated gtest shuffle seeds (needs tests): each ctest leg runs once unshuffled, then once per seed'
        required: false
        type: string
        default: ''
      repeat_test:
        description: 'Name-regex:N (needs tests): after the ctest run, each ctest leg runs that one case N times under ctest load'
        required: false
        type: string
        default: ''
      cmake_args:
        description: 'Extra CMake arguments, space-separated'
        required: false
        type: string
        default: ''
      schedulers:
        description: 'Comma-separated render schedulers whose ctest legs run (needs tests): legacy, taskgraph, or both. Milestone gates run both'
        required: false
        type: string
        default: 'legacy,taskgraph'
      label:
        description: 'Human label for the run title, usually the PR title'
        required: false
        type: string
        default: ''
      token:
        description: 'Opaque marker echoed into the run name so a script can find this run'
        required: false
        type: string
        default: ''
      gui_scripts:
        description: 'Space-separated Tests/gui/*.py scripts to run under Xvfb against the AppImage, one job each'
        required: false
        type: string
        default: ''
      from_run:
        description: 'Run id whose AppImage (of this preset) the GUI scripts use; skips the build, and the scripts come from that run''s commit'
        required: false
        type: string
        default: ''
      gui_ref:
        description: 'With from_run: branch or sha whose scripts, fixtures and run-gui-test.sh the GUI jobs check out instead of the from_run commit; the AppImage and dev image still come from from_run'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  # Downloads the AppImage of another run for from_run.
  actions: read

env:
  CI: 'True'
  PYTHON_VERSION: '3.13'
  OCIO_CONFIG_VERSION: 2.5
  NATRON_IN_CONTAINER: 1
  PRESET: ${{ inputs.preset || 'fast' }}

jobs:
  dev-image:
    name: Dev image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dev-image.yml

  # Builds once; the ctest legs below run off the build tree it uploads.
  remote-build:
    name: Build · ${{ inputs.preset || 'fast' }}${{ inputs.appimage && inputs.preset != 'debug' && ' + AppImage' || '' }}
    needs: dev-image
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.dev-image.outputs.image }}
      # The live texture tests export through /dev/shm, which Docker sizes at 64m.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: ${{ (inputs.preset || 'fast') == 'fast' && '2G' || '3G' }}
      # One compile per vCPU of the hosted runner; build.sh's default of 3 suits the dev machine.
      NATRON_BUILD_JOBS: 4
      # Debug links are large enough that several at once, beside the compiles, exhaust the runner's memory.
      NATRON_LINK_JOBS: ${{ inputs.preset == 'debug' && '1' || '' }}
    outputs:
      tree: ${{ steps.upload_tree.outcome }}
      appimage: ${{ steps.upload_appimage.outcome }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The primary key ends in run_id so every run saves a fresh entry
      # (a save under an existing exact key is a silent no-op); hits come
      # from the restore-keys prefixes.
      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ env.PRESET }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ env.PRESET }}-${{ github.head_ref || github.ref_name }}-
            ccache-linux-${{ env.PRESET }}-main-
            ${{ env.PRESET == 'debug' && 'ccache-linux-main-' || '' }}

      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/lensfun
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Build ${{ env.PRESET }} preset
        id: build
        env:
          WITH_TESTS: ${{ inputs.tests && '1' || '' }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
        run: |
          extra=()
          for word in $CMAKE_ARGS; do
            extra+=(--cmake-arg "$word")
          done
          tools/ci/local/build.sh "$PRESET" ${WITH_TESTS:+--tests} "${extra[@]}" --no-ccache-stats

      # An extra-argument build lands in build/<preset>-<hash>, but test.sh and the packaging steps
      # look in build/<preset>; a relative link makes the real tree answer to that name.
      - name: Link build tree
        if: steps.build.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.build.outputs.build_dir }}
        run: |
          if [[ "$(basename "$BUILD_DIR")" != "$PRESET" ]]; then
            ln -sfn "$(basename "$BUILD_DIR")" "build/$PRESET"
          fi

      # Runs before the ctest legs so they replay the references just recorded.
      - name: Record native goldens
        if: inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
        timeout-minutes: 15
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          NATRON_RENDER_SCHEDULER: legacy
          NATRON_GOLDEN_RECORD_DIR: ${{ github.workspace }}/Tests/fixtures/native-golden
          OFX_PLUGIN_PATH: ${{ github.workspace }}/build/assets/Plugins
        working-directory: build/${{ env.PRESET }}
        run: |
          set -o pipefail
          mkdir -p "$NATRON_GOLDEN_RECORD_DIR"
          rc=0
          xvfb-run --auto-servernum ctest -R '^(NativeGoldenTest|NativeIDistortAmountTest|NativeIWarpTest|USDRenderCyclesTest|BezierGuiCopyEquivalenceTest|USDRenderCyclesLiveTextureTest|USDRenderMoonRayLiveTextureTest|USDRenderCyclesProjectionTest|USDRenderMoonRayProjectionTest)$' --timeout 300 --output-on-failure || rc=$?
          # Storm skips and passes when no GL context can be made; REQUIRE_GL turns that into a failure.
          NATRON_TEST_REQUIRE_GL=1 xvfb-run --auto-servernum ctest -R '^USDRenderStormTest$' --timeout 600 --output-on-failure || rc=$?
          # The node suites' own Golden cases go through the same recorder. ctest entries are whole
          # suites, so the cases are picked by filter, with a process per suite as under ctest.
          suites=$(cd Tests && ./Tests --gtest_list_tests --gtest_filter='*.Golden*' | sed -n 's/^\([A-Za-z0-9_]*\)\.\( .*\)\{0,1\}$/\1/p') || rc=1
          test -n "$suites" || rc=1
          for suite in $suites; do
            (cd Tests && xvfb-run --auto-servernum timeout 300 ./Tests --gtest_filter="$suite.Golden*") || rc=$?
          done
          test -f "$NATRON_GOLDEN_RECORD_DIR/STAMP" || rc=1
          exit "$rc"

      # Straight after recording, so that a later leg that fails, times out or is cancelled cannot
      # lose the references; a node whose case failed is simply absent from them.
      - name: Upload native goldens
        if: >-
          !cancelled() && inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
          && hashFiles('Tests/fixtures/native-golden/STAMP') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-goldens-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-golden
          if-no-files-found: error
          retention-days: 7

      # The binary directly, because ctest registers whole suites and every other case passing true
      # to expectParity, motion-blur-centered among them, would record over its reference too.
      - name: Record native parity references
        id: record_parity
        if: >-
          !cancelled() && inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
        timeout-minutes: 15
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          NATRON_RENDER_SCHEDULER: legacy
          NATRON_PARITY_RECORD_DIR: ${{ github.workspace }}/Tests/fixtures/native-parity
          OFX_PLUGIN_PATH: ${{ github.workspace }}/build/assets/Plugins:${{ github.workspace }}/build/assets/TestPlugins
        working-directory: build/${{ env.PRESET }}/Tests
        run: >-
          xvfb-run --auto-servernum ./Tests
          --gtest_filter='NativeTransformTest.CubicMinifyingAndRotated:NativeTransformTest.SkewYX:NativeTransformTest.MaskedMixHalf:NativeReformatTest.ToProjectFormatFromTheSourceRoD:NativeReformatTest.ToFormatWithAPixelAspectRatio:NativeReformatTest.FitIntoAFixedBox'

      - name: Upload native parity references
        if: >-
          !cancelled() && steps.record_parity.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-parity-${{ env.PRESET }}-${{ github.sha }}
          path: |
            Tests/fixtures/native-parity/Transform/rotate30-scale05-cubic*.f32
            Tests/fixtures/native-parity/Transform/skew-yx*.f32
            Tests/fixtures/native-parity/Transform/mask-mix05*.f32
            Tests/fixtures/native-parity/Reformat/project*.f32
            Tests/fixtures/native-parity/Reformat/format-par*.f32
            Tests/fixtures/native-parity/Reformat/box-fit*.f32
          if-no-files-found: error
          retention-days: 7

      # A tar because artifacts drop the executable bit. Object files and static archives are
      # only build inputs, and Testing/ holds this job's golden-recording run. An extra-argument
      # build packs its real tree next to the build/<preset> link, which tar stores as a link.
      - name: Pack build tree
        if: inputs.tests && !cancelled() && steps.build.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.build.outputs.build_dir }}
        run: |
          trees=("build/$PRESET")
          real="build/$(basename "$BUILD_DIR")"
          if [[ "$real" != "build/$PRESET" ]]; then
            trees+=("$real")
          fi
          tar -cf build-tree.tar --exclude='*.o' --exclude='*.a' --exclude="$real/Testing" "${trees[@]}"
          ls -lh build-tree.tar

      - name: Upload build tree
        id: upload_tree
        if: inputs.tests && !cancelled() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-tree-${{ env.PRESET }}
          path: build-tree.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      # Gated on the build rather than on test success: a red test leg
      # should not withhold the binary someone is trying to inspect.
      # check-startup.sh runs inside make-appimage.sh.
      - name: Stage bundle
        if: inputs.appimage && inputs.preset != 'debug' && !cancelled() && steps.build.outcome == 'success'
        run: tools/release/stage-bundle.sh "build/$PRESET" /tmp/natron-stage

      - name: Create AppImage
        if: inputs.appimage && inputs.preset != 'debug' && !cancelled() && steps.build.outcome == 'success'
        run: tools/release/make-appimage.sh /tmp/natron-stage /tmp/artifacts

      - name: Upload AppImage
        id: upload_appimage
        if: inputs.appimage && inputs.preset != 'debug' && !cancelled() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: natron-${{ env.PRESET }}-${{ github.sha }}
          path: /tmp/artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
          APPIMAGE_UPLOAD: ${{ steps.upload_appimage.outcome }}
          TREE_UPLOAD: ${{ steps.upload_tree.outcome }}
        run: |
          artifacts=()
          if [[ "$TREE_UPLOAD" == success ]]; then artifacts+=("build-tree-$PRESET"); fi
          if [[ "$APPIMAGE_UPLOAD" == success ]]; then artifacts+=("natron-$PRESET-$GITHUB_SHA"); fi
          # shellcheck disable=SC2086
          tools/ci/summary.sh build "$PRESET" "$(IFS=,; echo "${artifacts[*]}")" $CMAKE_ARGS

  # Turns the schedulers input into the ctest matrix, and rejects an unknown name before any build starts.
  ctest-legs:
    name: Setup · pick test legs
    if: inputs.tests && !inputs.from_run
    runs-on: ubuntu-latest
    outputs:
      schedulers: ${{ steps.legs.outputs.schedulers }}
    steps:
      - name: Resolve schedulers
        id: legs
        env:
          SCHEDULERS: ${{ inputs.schedulers }}
        run: |
          legs=()
          IFS=',' read -r -a requested <<< "${SCHEDULERS:-legacy,taskgraph}"
          for name in "${requested[@]}"; do
            case "$name" in
              legacy|taskgraph) ;;
              *) echo "unknown scheduler '$name' (expected legacy or taskgraph)" >&2; exit 1 ;;
            esac
            case " ${legs[*]-} " in
              *" $name "*) ;;
              *) legs+=("$name") ;;
            esac
          done
          json="$(printf '"%s",' "${legs[@]}")"
          echo "schedulers=[${json%,}]" >> "$GITHUB_OUTPUT"

  ctest:
    name: Test · ${{ matrix.scheduler == 'taskgraph' && 'task-graph' || matrix.scheduler }} scheduler
    needs: [dev-image, remote-build, ctest-legs]
    if: >-
      !cancelled() && inputs.tests && needs.remote-build.outputs.tree == 'success'
      && needs.ctest-legs.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheduler: ${{ fromJSON(needs.ctest-legs.outputs.schedulers) }}
    container:
      image: ${{ needs.dev-image.outputs.image }}
      # The live texture tests export through /dev/shm, which Docker sizes at 64m.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The build job saved both entries, so these hit and fetch-assets.sh is a stamp check.
      - name: Restore test assets
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/lensfun
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      # Missing when recording failed outright; the leg then replays the committed references,
      # as it would have in the build job.
      - name: Download native goldens from the build job
        if: inputs.record_goldens
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: native-goldens-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-golden

      - name: Download native parity references from the build job
        if: inputs.record_goldens
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: native-parity-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-parity

      - name: Download build tree from the build job
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-tree-${{ env.PRESET }}

      # The tree's absolute paths hold because every job's workspace is mounted at the same path.
      - name: Unpack build tree from the build job
        run: |
          tar -xf build-tree.tar
          rm build-tree.tar

      # An absent cache entry means the option's default, ON. Some suites test only that the
      # variable is set, so a GPU-off tree must leave it unset rather than set it to 0.
      - name: Detect GPU build
        run: |
          value=$(sed -n 's/^NATRON_GPU:[A-Z]*=//p' "build/$PRESET/CMakeCache.txt")
          case "${value^^}" in
            OFF|FALSE|NO|N|0|IGNORE|NOTFOUND|*-NOTFOUND) ;;
            *) echo "NATRON_TEST_REQUIRE_GPU=1" >> "$GITHUB_ENV" ;;
          esac

      # Without the step bound, a suite that outlives ctest's own per-suite timeout holds the job
      # until GitHub's six-hour limit. A debug suite runs for about 50 minutes, as in PR CI.
      - name: Run ctest suite (${{ matrix.scheduler }} scheduler)
        timeout-minutes: ${{ inputs.shuffle_seeds != '' && 120 || inputs.preset == 'debug' && 75 || 30 }}
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          SHUFFLE_SEEDS: ${{ inputs.shuffle_seeds }}
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          # One suite per vCPU of the hosted runner; 1 restores the serial `ctest -V` run.
          NATRON_CTEST_JOBS: 4
        run: |
          set -o pipefail
          if [[ -n "$SHUFFLE_SEEDS" ]]; then
            seed_list=${SHUFFLE_SEEDS//,/ }
            seed_count=$(wc -w <<<"$seed_list")
            if (( seed_count > 5 )); then
              echo "::error::shuffle_seeds has $seed_count seeds; at most 5 fit the 120-minute ctest step timeout"
              exit 1
            fi
          fi
          grep -m1 'model name' /proc/cpuinfo; nproc; grep -o -w 'avx512f' /proc/cpuinfo | head -1 || true
          mkdir -p ctest-logs
          rc=0
          tools/ci/local/test.sh ctest "$PRESET" 2>&1 | tee "ctest-logs/ctest-${{ matrix.scheduler }}.log" || rc=$?
          # Every seed runs even after a failure, so one dispatch reports all of them; the leg
          # fails if any run did.
          for seed in ${SHUFFLE_SEEDS//,/ }; do
            echo "== shuffled ctest run, seed $seed =="
            GTEST_SHUFFLE=1 GTEST_RANDOM_SEED="$seed" tools/ci/local/test.sh ctest "$PRESET" 2>&1 \
              | tee "ctest-logs/ctest-${{ matrix.scheduler }}-seed${seed}.log" || rc=$?
          done
          exit "$rc"

      - name: Repeat one ctest case (${{ matrix.scheduler }} scheduler)
        if: (success() || failure()) && inputs.repeat_test != ''
        timeout-minutes: 90
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          REPEAT_TEST: ${{ inputs.repeat_test }}
        run: |
          set -o pipefail
          mkdir -p ctest-logs
          tools/ci/local/test.sh repeat "${REPEAT_TEST%:*}" "${REPEAT_TEST##*:}" "$PRESET" 2>&1 \
            | tee "ctest-logs/ctest-${{ matrix.scheduler }}-repeat.log"

      - name: Run Python bindings smoke test (${{ matrix.scheduler }} scheduler)
        if: success() || failure()
        env:
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          NATRON_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/build/smoke-reference
        run: tools/ci/local/test.sh smoke "$PRESET"

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-log-${{ matrix.scheduler }}-${{ env.PRESET }}-${{ github.sha }}
          path: ctest-logs/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload smoke renders
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-render-${{ matrix.scheduler }}-${{ env.PRESET }}-${{ github.sha }}
          path: build/smoke-reference
          if-no-files-found: ignore
          retention-days: 1

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SCHEDULER: ${{ matrix.scheduler }}
          SCHEDULER_LABEL: ${{ matrix.scheduler == 'taskgraph' && 'task-graph' || matrix.scheduler }}
        run: tools/ci/summary.sh ctest "$SCHEDULER" "build/$PRESET" "ctest-log-$SCHEDULER-$PRESET-$GITHUB_SHA" "$SCHEDULER_LABEL"

  # Gathers the legs' logs into the one artifact tools/ci/remote/build.sh downloads, and holds the
  # byte-for-byte comparison of the two schedulers' smoke renders, which spans both legs.
  results:
    name: Collect logs and compare renders
    needs: [remote-build, ctest-legs, ctest]
    if: always() && inputs.tests && !inputs.from_run
    runs-on: ubuntu-latest
    steps:
      - name: Download ctest logs from every ctest leg
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ctest-log-*-${{ env.PRESET }}-${{ github.sha }}
          merge-multiple: true
          path: ctest-logs

      - name: Upload ctest logs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-logs-${{ env.PRESET }}-${{ github.sha }}
          path: ctest-logs/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Require every ctest leg to pass
        env:
          RESULT: ${{ needs.ctest.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "ctest matrix result: $RESULT" >&2
            exit 1
          fi

      - name: Download smoke renders from every ctest leg
        if: ${{ contains(needs.ctest-legs.outputs.schedulers, 'legacy') && contains(needs.ctest-legs.outputs.schedulers, 'taskgraph') }}
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: smoke-render-*-${{ env.PRESET }}-${{ github.sha }}
          path: smoke-renders

      - name: Compare smoke renders across schedulers
        if: ${{ contains(needs.ctest-legs.outputs.schedulers, 'legacy') && contains(needs.ctest-legs.outputs.schedulers, 'taskgraph') }}
        env:
          SUFFIX: ${{ env.PRESET }}-${{ github.sha }}
        run: |
          test -d "smoke-renders/smoke-render-legacy-$SUFFIX"
          test -d "smoke-renders/smoke-render-taskgraph-$SUFFIX"
          diff -r "smoke-renders/smoke-render-legacy-$SUFFIX" "smoke-renders/smoke-render-taskgraph-$SUFFIX"

      # The job has no checkout of its own; a sparse one under its own path leaves the downloads alone.
      - name: Checkout the summary script
        if: always()
        uses: actions/checkout@v5.0.1
        with:
          path: ci-src
          sparse-checkout: tools/ci/summary.sh
          submodules: false
          lfs: false

      - name: Job summary
        if: always()
        env:
          BUILD_RESULT: ${{ needs.remote-build.result }}
          CTEST_RESULT: ${{ needs.ctest.result }}
        run: |
          ci-src/tools/ci/summary.sh legs "Test results · $PRESET" \
            "Build · $PRESET=$BUILD_RESULT" \
            "Test legs=$CTEST_RESULT" \
            "Log artifact=ctest-logs-$PRESET-$GITHUB_SHA"

  # Resolves what the GUI jobs run: the script matrix, the commit whose scripts and fixtures they
  # check out, the AppImage artifact and the run holding it, and the dev image. For from_run all
  # of these come from that run, so a branch without this workflow can still be checked; its
  # commit's dev image matches the PySide6 its AppImage bundles, which run-gui-test.sh relies on.
  gui-matrix:
    name: Setup · pick GUI scripts
    needs: dev-image
    if: inputs.gui_scripts != '' || inputs.from_run != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      run: ${{ steps.resolve.outputs.run }}
      artifact: ${{ steps.resolve.outputs.artifact }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve scripts and AppImage
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GUI_SCRIPTS: ${{ inputs.gui_scripts }}
          FROM_RUN: ${{ inputs.from_run }}
          GUI_REF: ${{ inputs.gui_ref }}
          APPIMAGE: ${{ inputs.appimage }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${GUI_SCRIPTS// /}" ]]; then
            echo "::error::from_run needs gui_scripts; it skips the build, so there is nothing else to do"
            exit 1
          fi
          if [[ -n "$GUI_REF" && -z "$FROM_RUN" ]]; then
            echo "::error::gui_ref only applies with from_run"
            exit 1
          fi
          matrix='[]'
          for script in $GUI_SCRIPTS; do
            if ! [[ "$script" =~ ^Tests/gui/[A-Za-z0-9_][A-Za-z0-9_.-]*\.py$ ]]; then
              echo "::error::gui_scripts entry '$script' is not a Tests/gui/<name>.py path"
              exit 1
            fi
            matrix=$(jq -c --arg s "$script" --arg n "$(basename "$script" .py)" \
              '. + [{script: $s, name: $n}] | unique_by(.name)' <<<"$matrix")
          done
          if [[ -n "$FROM_RUN" ]]; then
            if ! [[ "$FROM_RUN" =~ ^[0-9]+$ ]]; then
              echo "::error::from_run '$FROM_RUN' is not a run id"
              exit 1
            fi
            SHA=$(gh api "repos/$REPO/actions/runs/$FROM_RUN" --jq .head_sha)
            RUN_ID="$FROM_RUN"
            artifact="natron-$PRESET-$SHA"
            available=$(gh api --paginate "repos/$REPO/actions/runs/$FROM_RUN/artifacts" \
              --jq '.artifacts[] | select(.expired | not) | .name')
            if ! grep -qxF "$artifact" <<<"$available"; then
              echo "::error::run $FROM_RUN has no artifact $artifact; its unexpired AppImages: $(grep '^natron-' <<<"$available" | tr '\n' ' ')"
              exit 1
            fi
          else
            if [[ "$APPIMAGE" != true || "$PRESET" == debug ]]; then
              echo "::error::gui_scripts need an AppImage: set appimage and a fast or release preset, or use from_run"
              exit 1
            fi
            artifact="natron-$PRESET-$SHA"
          fi
          {
            echo "matrix=$matrix"
            echo "sha=$SHA"
            echo "ref=${GUI_REF:-$SHA}"
            echo "run=$RUN_ID"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the commit under test
        if: inputs.from_run != ''
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          submodules: false
          lfs: false

      - name: Resolve dev image
        id: image
        env:
          FROM_RUN: ${{ inputs.from_run }}
          IMAGE: ${{ needs.dev-image.outputs.image }}
        run: |
          if [[ -n "$FROM_RUN" && -x tools/ci/local/dev-image-tag.sh ]]; then
            IMAGE=$(tools/ci/local/dev-image-tag.sh)
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  gui:
    name: GUI · ${{ matrix.name }}
    needs: [gui-matrix, remote-build]
    if: >-
      !cancelled() && needs.gui-matrix.result == 'success'
      && (inputs.from_run != '' || needs.remote-build.outputs.appimage == 'success')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gui-matrix.outputs.matrix) }}
    container:
      image: ${{ needs.gui-matrix.outputs.image }}
      # The live texture tests export through /dev/shm, which Docker sizes at 64m.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      # The scripts and their fixtures come from the commit the AppImage was built from, or from
      # gui_ref when given.
      - name: Checkout the commit under test
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ needs.gui-matrix.outputs.ref }}
          submodules: false
          lfs: false

      # Only the LFS fixtures a script names are fetched, so most scripts download none.
      - name: List LFS fixtures the script uses
        id: lfs
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
          include=()
          if [[ -f "$SCRIPT" ]]; then
            while IFS= read -r path; do
              if grep -qF "$(basename "$path")" "$SCRIPT"; then
                include+=("$path")
              fi
            done < <(git lfs ls-files -n)
          fi
          echo "include=$(IFS=,; echo "${include[*]}")" >> "$GITHUB_OUTPUT"

      # Restore only: a save here would store a partial object set under the full set's key.
      - name: Restore LFS objects
        if: steps.lfs.outputs.include != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS fixtures
        if: steps.lfs.outputs.include != ''
        env:
          INCLUDE: ${{ steps.lfs.outputs.include }}
        run: |
          git lfs install --local
          git lfs pull --include "$INCLUDE"

      - name: Download AppImage from the build job
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.gui-matrix.outputs.artifact }}
          run-id: ${{ needs.gui-matrix.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: gui-appimage

      - name: Run ${{ matrix.script }}
        timeout-minutes: 25
        env:
          SCRIPT: ${{ matrix.script }}
          GUI_TEST_SCREEN_SIZE: 1920x1080
          GUI_TEST_TIMEOUT: 900
          ARTIFACT: ${{ needs.gui-matrix.outputs.artifact }}
        run: |
          appimage=$(find gui-appimage -name '*.AppImage' -print -quit)
          if [[ -z "$appimage" ]]; then
            echo "::error::no AppImage in $ARTIFACT"
            exit 1
          fi
          export NATRON_GUI_TEST_OUT="$GITHUB_WORKSPACE/build/gui-out"
          Tests/gui/run-gui-test.sh "$SCRIPT" "$appimage"

      - name: Upload GUI output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.name }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out
          if-no-files-found: warn
          retention-days: 7

      # The commit under test may predate the script.
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SCRIPT: ${{ matrix.script }}
          LEG_NAME: ${{ matrix.name }}
          TESTED_SHA: ${{ needs.gui-matrix.outputs.sha }}
        run: |
          if [[ -x tools/ci/summary.sh ]]; then
            tools/ci/summary.sh gui "$SCRIPT" "$JOB_STATUS" "gui-$LEG_NAME-$PRESET-$TESTED_SHA"
          fi
