name: Remote build

# The "what ran" part is format('build{0}{1}{2}{3}{4}{5}', ...) where each
# conditional fragment carries its own leading ", ", so no trailing separator
# can appear. A from_run dispatch builds nothing and replaces the list.
run-name: ${{ github.event_name == 'push' && format('Remote build · fast · {0} (cache warm)', github.ref_name) || format('Remote build · {0} · {1}{2}{3}', inputs.preset, inputs.from_run != '' && format('GUI only (from run {0})', inputs.from_run) || format('build{0}{1}{2}{3}{4}{5}', inputs.tests && ', tests' || '', inputs.appimage && ', AppImage' || '', inputs.gui_scripts != '' && ', GUI' || '', inputs.record_goldens && ', goldens' || '', inputs.cmake_args != '' && format(', cmake:{0}', inputs.cmake_args) || '', inputs.ctest_regex != '' && format(', ctest -R {0}', inputs.ctest_regex) || ''), inputs.label != '' && format(' · {0}', inputs.label) || '', inputs.token != '' && format(' · {0}', inputs.token) || '') }}

on:
  # A push run builds fast with no tests and no AppImage; it exists to
  # keep main's fast ccache entry warm for branch runs to fall back on.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preset:
        description: 'Build preset'
        required: true
        type: choice
        options:
          - fast
          - release
          - debug
        default: fast
      tests:
        description: 'Run the ctest suite and smoke test'
        required: true
        type: boolean
        default: false
      record_goldens:
        description: 'Record the native golden renders (needs tests) and upload them'
        required: false
        type: boolean
        default: false
      appimage:
        description: 'Package and upload an AppImage, as gui_scripts need (ignored for debug, which cannot be packaged in the container)'
        required: true
        type: boolean
        default: false
      shuffle_seeds:
        description: 'Comma-separated gtest shuffle seeds (needs tests): the ctest job runs once unshuffled, then once per seed'
        required: false
        type: string
        default: ''
      repeat_test:
        description: 'Name-regex:N (needs tests): after the ctest run, the ctest job runs that one case N times under ctest load'
        required: false
        type: string
        default: ''
      repeat_parallel:
        description: 'With repeat_test: copies of the case run at once (empty: test.sh default, 4)'
        required: false
        type: string
        default: ''
      repeat_timeout:
        description: 'With repeat_test: seconds each copy may run before its stacks are dumped and it is killed (empty: test.sh default, 900)'
        required: false
        type: string
        default: ''
      cmake_args:
        description: 'Extra CMake arguments, space-separated'
        required: false
        type: string
        default: ''
      ctest_regex:
        description: 'With tests: run only the ctest entries matching this regex (ctest -R), for intermediate gates. Milestone gates leave it empty'
        required: false
        type: string
        default: ''
      label:
        description: 'Human label for the run title, usually the PR title'
        required: false
        type: string
        default: ''
      token:
        description: 'Opaque marker echoed into the run name so a script can find this run'
        required: false
        type: string
        default: ''
      remote_ccache:
        description: 'Use the shared remote ccache storage (the CCACHE_REMOTE_STORAGE secret) beside the actions/cache ccache'
        required: false
        type: boolean
        default: true
      gui_scripts:
        description: 'Space-separated Tests/gui/*.py scripts to run under Xvfb against the AppImage, in up to 4 jobs'
        required: false
        type: string
        default: ''
      from_run:
        description: 'Run id whose AppImage (of this preset) the GUI scripts use; skips the build, and the scripts come from that run''s commit'
        required: false
        type: string
        default: ''
      gui_ref:
        description: 'With from_run: branch or sha whose scripts, fixtures and run-gui-test.sh the GUI jobs check out instead of the from_run commit; the AppImage and dev image still come from from_run'
        required: false
        type: string
        default: ''
      debug_symbols:
        description: 'With appimage: also upload the symbol tables strip removes from the bundle (natron-symbols-<preset>-<sha>), for stack samples of that AppImage; the AppImage itself is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Downloads the AppImage of another run for from_run.
  actions: read

env:
  CI: 'True'
  PYTHON_VERSION: '3.13'
  OCIO_CONFIG_VERSION: 2.5
  NATRON_IN_CONTAINER: 1
  PRESET: ${{ inputs.preset || 'fast' }}

jobs:
  dev-image:
    name: Dev image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dev-image.yml

  # Builds once; the ctest job and the package job below run off the build tree it uploads.
  remote-build:
    name: Build · ${{ inputs.preset || 'fast' }}
    needs: dev-image
    if: ${{ !inputs.from_run }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.dev-image.outputs.image }}
      # The live texture tests export through /dev/shm, which Docker sizes at 64m.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: ${{ (inputs.preset || 'fast') == 'fast' && '2G' || '3G' }}
      # An empty secret (fork PRs) or an empty value here leaves ccache local-only; push runs have no inputs.
      CCACHE_REMOTE_STORAGE: ${{ (inputs.remote_ccache || github.event_name == 'push') && secrets.CCACHE_REMOTE_STORAGE || '' }}
      # Compiler mtimes differ between hosts; hash content so keys match.
      CCACHE_COMPILERCHECK: content
      # One compile per vCPU of the hosted runner; build.sh's default of 3 suits the dev machine.
      NATRON_BUILD_JOBS: 4
      # Debug links are large enough that several at once, beside the compiles, exhaust the runner's memory.
      NATRON_LINK_JOBS: ${{ inputs.preset == 'debug' && '1' || '' }}
    outputs:
      tree: ${{ steps.upload_tree.outcome }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The primary key ends in run_id so every run saves a fresh entry
      # (a save under an existing exact key is a silent no-op); hits come
      # from the restore-keys prefixes, ordered by the step before.
      - name: Order ccache restore keys
        id: ccache_keys
        env:
          FAMILY: ccache-linux-${{ env.PRESET }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXTRA_KEYS: ${{ env.PRESET == 'debug' && 'ccache-linux-main-' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/ci/ccache-restore-keys.sh

      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ env.PRESET }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: ${{ steps.ccache_keys.outputs.keys }}

      - name: Reset ccache statistics
        run: ccache -z

      - name: Normalise remote ccache layout
        run: tools/ci/ccache-remote-setup.sh

      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/lensfun
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Build ${{ env.PRESET }} preset
        id: build
        env:
          WITH_TESTS: ${{ inputs.tests && '1' || '' }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
        run: |
          extra=()
          for word in $CMAKE_ARGS; do
            extra+=(--cmake-arg "$word")
          done
          tools/ci/local/build.sh "$PRESET" ${WITH_TESTS:+--tests} "${extra[@]}" --no-ccache-stats

      # An extra-argument build lands in build/<preset>-<hash>, but test.sh and the packaging steps
      # look in build/<preset>; a relative link makes the real tree answer to that name.
      - name: Link build tree
        if: steps.build.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.build.outputs.build_dir }}
        run: |
          if [[ "$(basename "$BUILD_DIR")" != "$PRESET" ]]; then
            ln -sfn "$(basename "$BUILD_DIR")" "build/$PRESET"
          fi

      # Runs before the ctest job so they replay the references just recorded.
      - name: Record native goldens
        if: inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
        timeout-minutes: 15
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          NATRON_GOLDEN_RECORD_DIR: ${{ github.workspace }}/Tests/fixtures/native-golden
          OFX_PLUGIN_PATH: ${{ github.workspace }}/build/assets/Plugins
        working-directory: build/${{ env.PRESET }}
        run: |
          set -o pipefail
          mkdir -p "$NATRON_GOLDEN_RECORD_DIR"
          rc=0
          xvfb-run --auto-servernum ctest -R '^(NativeGoldenTest|NativeIDistortAmountTest|NativeIWarpTest|USDRenderCyclesTest|BezierGuiCopyEquivalenceTest|USDRenderCyclesLiveTextureTest|USDRenderMoonRayLiveTextureTest|USDRenderCyclesProjectionTest|USDRenderMoonRayProjectionTest)$' --timeout 300 --output-on-failure || rc=$?
          # Storm skips and passes when no GL context can be made; REQUIRE_GL turns that into a failure.
          NATRON_TEST_REQUIRE_GL=1 xvfb-run --auto-servernum ctest -R '^USDRenderStormTest$' --timeout 600 --output-on-failure || rc=$?
          # The node suites' own Golden cases go through the same recorder. ctest entries are whole
          # suites, so the cases are picked by filter, with a process per suite as under ctest.
          suites=$(cd Tests && ./Tests --gtest_list_tests --gtest_filter='*.Golden*' | sed -n 's/^\([A-Za-z0-9_]*\)\.\( .*\)\{0,1\}$/\1/p') || rc=1
          test -n "$suites" || rc=1
          for suite in $suites; do
            (cd Tests && xvfb-run --auto-servernum timeout 300 ./Tests --gtest_filter="$suite.Golden*") || rc=$?
          done
          # Storm references are recorded only for the cases named here: recording overwrites, so a
          # wildcard would rewrite every committed Storm golden.
          (cd Tests && xvfb-run --auto-servernum timeout 300 ./Tests --gtest_filter='USDRenderStormTest.EveryTileOfAUdimLiveTextureShows') || rc=$?
          test -f "$NATRON_GOLDEN_RECORD_DIR/STAMP" || rc=1
          xvfb-run --auto-servernum ctest -R '^NatronUtilityGoldenTest$' --timeout 300 --output-on-failure || rc=$?
          # Parity references ride in the golden artifact, where they cannot overwrite the committed ones.
          # The binary directly, as a suite's ctest entry passes its own --gtest_filter, which outranks
          # GTEST_FILTER. A node takes part by naming its cases Regression*.
          export NATRON_PARITY_RECORD_DIR="$NATRON_GOLDEN_RECORD_DIR/native-parity"
          (cd Tests && xvfb-run --auto-servernum timeout 300 ./Tests --gtest_filter='Native*Test.Regression*') || rc=$?
          # A filter that selects nothing exits 0.
          test -n "$(find "$NATRON_PARITY_RECORD_DIR" -name '*.f32' -print -quit)" || rc=1
          exit "$rc"

      # Straight after recording, so that a later leg that fails, times out or is cancelled cannot
      # lose the references; a node whose case failed is simply absent from them.
      - name: Upload native goldens
        if: >-
          !cancelled() && inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
          && hashFiles('Tests/fixtures/native-golden/STAMP') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-goldens-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-golden
          if-no-files-found: error
          retention-days: 7

      # The binary directly, because ctest registers whole suites and every other case passing true
      # to expectParity, motion-blur-centered among them, would record over its reference too.
      - name: Record native parity references
        id: record_parity
        if: >-
          !cancelled() && inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
        timeout-minutes: 15
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          NATRON_PARITY_RECORD_DIR: ${{ github.workspace }}/Tests/fixtures/native-parity
          OFX_PLUGIN_PATH: ${{ github.workspace }}/build/assets/Plugins:${{ github.workspace }}/build/assets/TestPlugins
        working-directory: build/${{ env.PRESET }}/Tests
        run: >-
          xvfb-run --auto-servernum ./Tests
          --gtest_filter='NativeTransformTest.CubicMinifyingAndRotated:NativeTransformTest.SkewYX:NativeTransformTest.MaskedMixHalf:NativeReformatTest.ToProjectFormatFromTheSourceRoD:NativeReformatTest.ToFormatWithAPixelAspectRatio:NativeReformatTest.FitIntoAFixedBox'

      - name: Upload native parity references
        if: >-
          !cancelled() && steps.record_parity.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-parity-${{ env.PRESET }}-${{ github.sha }}
          path: |
            Tests/fixtures/native-parity/Transform/rotate30-scale05-cubic*.f32
            Tests/fixtures/native-parity/Transform/skew-yx*.f32
            Tests/fixtures/native-parity/Transform/mask-mix05*.f32
            Tests/fixtures/native-parity/Reformat/project*.f32
            Tests/fixtures/native-parity/Reformat/format-par*.f32
            Tests/fixtures/native-parity/Reformat/box-fit*.f32
          if-no-files-found: error
          retention-days: 7

      # A tar because artifacts drop the executable bit. Object files and static archives are
      # only build inputs, and Testing/ holds this job's golden-recording run. An extra-argument
      # build packs its real tree next to the build/<preset> link, which tar stores as a link.
      - name: Pack build tree
        if: >-
          (inputs.tests || (inputs.appimage && inputs.preset != 'debug'))
          && !cancelled() && steps.build.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.build.outputs.build_dir }}
        run: |
          trees=("build/$PRESET")
          real="build/$(basename "$BUILD_DIR")"
          if [[ "$real" != "build/$PRESET" ]]; then
            trees+=("$real")
          fi
          tar -cf build-tree.tar --exclude='*.o' --exclude='*.a' --exclude="$real/Testing" "${trees[@]}"
          ls -lh build-tree.tar

      - name: Upload build tree
        id: upload_tree
        if: >-
          (inputs.tests || (inputs.appimage && inputs.preset != 'debug'))
          && !cancelled() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-tree-${{ env.PRESET }}
          path: build-tree.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: Show ccache stats
        if: always()
        run: tools/ci/ccache-stats-summary.sh

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
          TREE_UPLOAD: ${{ steps.upload_tree.outcome }}
        run: |
          artifacts=()
          if [[ "$TREE_UPLOAD" == success ]]; then artifacts+=("build-tree-$PRESET"); fi
          # shellcheck disable=SC2086
          tools/ci/summary.sh build "$PRESET" "$(IFS=,; echo "${artifacts[*]}")" $CMAKE_ARGS

  # Gated on the build tree rather than on test success:
  # a red test leg should not withhold the binary someone is trying to inspect.
  package:
    name: Package · ${{ inputs.preset || 'fast' }} AppImage
    needs: [dev-image, remote-build]
    if: >-
      !cancelled() && inputs.appimage && inputs.preset != 'debug'
      && needs.remote-build.outputs.tree == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.dev-image.outputs.image }}
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    outputs:
      appimage: ${{ steps.upload_appimage.outcome }}

    steps:
      # The build tree's CMakeCache.txt and install scripts point into the source checkout.
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # The bundle ships the OFX plugins and ONNX Runtime that fetch-assets.sh puts under
      # build/assets; the build job saved the entry, so fetch-assets.sh is a stamp check.
      - name: Restore test assets
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/lensfun
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Download build tree from the build job
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-tree-${{ env.PRESET }}

      # The tree's absolute paths hold because every job's workspace is mounted at the same path.
      - name: Unpack build tree from the build job
        run: |
          tar -xf build-tree.tar
          rm build-tree.tar

      # check-startup.sh runs inside make-appimage.sh.
      - name: Stage bundle
        id: stage
        env:
          NATRON_STAGE_SYMBOLS_DIR: ${{ inputs.debug_symbols && '/tmp/natron-symbols' || '' }}
        run: tools/release/stage-bundle.sh "build/$PRESET" /tmp/natron-stage

      - name: Stage manifest
        id: stage_manifest
        if: >-
          !cancelled() && steps.stage.outcome == 'success'
        run: tools/release/stage-manifest.sh /tmp/natron-stage /tmp/stage-manifest.txt

      - name: Upload stage manifest
        id: upload_manifest
        if: >-
          !cancelled() && steps.stage_manifest.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: stage-manifest-${{ env.PRESET }}-${{ github.sha }}
          path: /tmp/stage-manifest.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create AppImage
        id: create_appimage
        if: >-
          !cancelled() && steps.stage.outcome == 'success'
        run: tools/release/make-appimage.sh /tmp/natron-stage /tmp/artifacts

      - name: Upload AppImage
        id: upload_appimage
        if: >-
          !cancelled() && steps.create_appimage.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: natron-${{ env.PRESET }}-${{ github.sha }}
          path: /tmp/artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 7

      # One tarball, so the .build-id tree survives the artifact's handling of hidden files.
      - name: Pack symbols
        if: inputs.debug_symbols && steps.upload_appimage.outcome == 'success'
        run: tar -C /tmp/natron-symbols -czf /tmp/natron-symbols.tar.gz .

      - name: Upload symbols
        if: inputs.debug_symbols && steps.upload_appimage.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: natron-symbols-${{ env.PRESET }}-${{ github.sha }}
          path: /tmp/natron-symbols.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          APPIMAGE_UPLOAD: ${{ steps.upload_appimage.outcome }}
          MANIFEST_UPLOAD: ${{ steps.upload_manifest.outcome }}
        run: |
          artifacts=()
          if [[ "$APPIMAGE_UPLOAD" == success ]]; then artifacts+=("natron-$PRESET-$GITHUB_SHA"); fi
          if [[ "$MANIFEST_UPLOAD" == success ]]; then artifacts+=("stage-manifest-$PRESET-$GITHUB_SHA"); fi
          tools/ci/summary.sh note "Package · $PRESET" \
            "Result: ${JOB_STATUS:-unknown}" \
            "Artifacts: ${artifacts[*]:-none}"

  ctest:
    name: Test
    needs: [dev-image, remote-build]
    if: >-
      !cancelled() && inputs.tests && !inputs.from_run
      && needs.remote-build.outputs.tree == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.dev-image.outputs.image }}
      # The live texture tests export through /dev/shm, which Docker sizes at 64m.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The build job saved both entries, so these hit and fetch-assets.sh is a stamp check.
      - name: Restore test assets
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/CImg
            build/assets/rawspeed
            build/assets/lensfun
            build/assets/onnxruntime
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      # Missing when recording failed outright; the job then replays the committed references,
      # as it would have in the build job.
      - name: Download native goldens from the build job
        if: inputs.record_goldens
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: native-goldens-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-golden

      - name: Download native parity references from the build job
        if: inputs.record_goldens
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: native-parity-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-parity

      - name: Download build tree from the build job
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-tree-${{ env.PRESET }}

      # The tree's absolute paths hold because every job's workspace is mounted at the same path.
      - name: Unpack build tree from the build job
        run: |
          tar -xf build-tree.tar
          rm build-tree.tar

      # An absent cache entry means the option's default, ON. Some suites test only that the
      # variable is set, so a GPU-off tree must leave it unset rather than set it to 0.
      - name: Detect GPU build
        run: |
          value=$(sed -n 's/^NATRON_GPU:[A-Z]*=//p' "build/$PRESET/CMakeCache.txt")
          case "${value^^}" in
            OFF|FALSE|NO|N|0|IGNORE|NOTFOUND|*-NOTFOUND) ;;
            *) echo "NATRON_TEST_REQUIRE_GPU=1" >> "$GITHUB_ENV" ;;
          esac

      # Without the step bound, a suite that outlives ctest's own per-suite timeout holds the job
      # until GitHub's six-hour limit. A debug suite runs for about 50 minutes, as in PR CI.
      - name: Run ctest suite
        timeout-minutes: ${{ inputs.shuffle_seeds != '' && 120 || inputs.preset == 'debug' && 75 || 45 }}
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          SHUFFLE_SEEDS: ${{ inputs.shuffle_seeds }}
          NATRON_CTEST_REGEX: ${{ inputs.ctest_regex }}
          # One suite per vCPU of the hosted runner; 1 restores the serial `ctest -V` run.
          NATRON_CTEST_JOBS: 4
        run: |
          set -o pipefail
          if [[ -n "$SHUFFLE_SEEDS" ]]; then
            seed_list=${SHUFFLE_SEEDS//,/ }
            seed_count=$(wc -w <<<"$seed_list")
            if (( seed_count > 5 )); then
              echo "::error::shuffle_seeds has $seed_count seeds; at most 5 fit the 120-minute ctest step timeout"
              exit 1
            fi
          fi
          grep -m1 'model name' /proc/cpuinfo; nproc; grep -o -w 'avx512f' /proc/cpuinfo | head -1 || true
          mkdir -p ctest-logs
          rc=0
          tools/ci/local/test.sh ctest "$PRESET" 2>&1 | tee "ctest-logs/ctest.log" || rc=$?
          # Every seed runs even after a failure, so one dispatch reports all of them; the leg
          # fails if any run did.
          for seed in ${SHUFFLE_SEEDS//,/ }; do
            echo "== shuffled ctest run, seed $seed =="
            GTEST_SHUFFLE=1 GTEST_RANDOM_SEED="$seed" tools/ci/local/test.sh ctest "$PRESET" 2>&1 \
              | tee "ctest-logs/ctest-seed${seed}.log" || rc=$?
          done
          exit "$rc"

      - name: Repeat one ctest case
        if: (success() || failure()) && inputs.repeat_test != ''
        timeout-minutes: 90
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          GALLIUM_OVERRIDE_CPU_CAPS: avx
          REPEAT_TEST: ${{ inputs.repeat_test }}
          REPEAT_PARALLEL: ${{ inputs.repeat_parallel }}
          REPEAT_TIMEOUT: ${{ inputs.repeat_timeout }}
        run: |
          set -o pipefail
          mkdir -p ctest-logs
          extra=()
          if [[ -n "$REPEAT_PARALLEL" ]]; then
            extra+=(--parallel "$REPEAT_PARALLEL")
          fi
          if [[ -n "$REPEAT_TIMEOUT" ]]; then
            extra+=(--timeout "$REPEAT_TIMEOUT")
          fi
          tools/ci/local/test.sh repeat "${REPEAT_TEST%:*}" "${REPEAT_TEST##*:}" "${extra[@]}" "$PRESET" 2>&1 \
            | tee "ctest-logs/ctest-repeat.log"

      - name: Run Python bindings smoke test
        if: success() || failure()
        run: tools/ci/local/test.sh smoke "$PRESET"

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-log-${{ env.PRESET }}-${{ github.sha }}
          path: ctest-logs/*
          if-no-files-found: ignore
          retention-days: 1

      # Every iteration's log and, for a hung one, its thread stacks: the repeat step's own log only holds the
      # first failure's output.
      - name: Upload repeat iteration logs
        if: always() && inputs.repeat_test != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-repeat-${{ env.PRESET }}-${{ github.sha }}
          path: build/${{ env.PRESET }}/Testing/repeat/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: tools/ci/summary.sh ctest "build/$PRESET" "ctest-log-$PRESET-$GITHUB_SHA"

  # Gathers the test logs into the one artifact tools/ci/remote/build.sh downloads.
  results:
    name: Collect logs
    needs: [remote-build, ctest]
    if: always() && inputs.tests && !inputs.from_run
    runs-on: ubuntu-latest
    steps:
      - name: Download ctest logs
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ctest-log-${{ env.PRESET }}-${{ github.sha }}
          merge-multiple: true
          path: ctest-logs

      - name: Upload ctest logs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-logs-${{ env.PRESET }}-${{ github.sha }}
          path: ctest-logs/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Require the ctest job to pass
        env:
          RESULT: ${{ needs.ctest.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "ctest result: $RESULT" >&2
            exit 1
          fi

      # The job has no checkout of its own; a sparse one under its own path leaves the downloads alone.
      - name: Checkout the summary script
        if: always()
        uses: actions/checkout@v5.0.1
        with:
          path: ci-src
          sparse-checkout: tools/ci/summary.sh
          submodules: false
          lfs: false

      - name: Job summary
        if: always()
        env:
          BUILD_RESULT: ${{ needs.remote-build.result }}
          CTEST_RESULT: ${{ needs.ctest.result }}
        run: |
          ci-src/tools/ci/summary.sh legs "Test results · $PRESET" \
            "Build · $PRESET=$BUILD_RESULT" \
            "Test=$CTEST_RESULT" \
            "Log artifact=ctest-logs-$PRESET-$GITHUB_SHA"

  # Resolves what the GUI jobs run: the script matrix, the commit whose scripts and fixtures they
  # check out, the AppImage artifact and the run holding it, and the dev image. For from_run all
  # of these come from that run, so a branch without this workflow can still be checked; its
  # commit's dev image matches the PySide6 its AppImage bundles, which run-gui-test.sh relies on.
  gui-matrix:
    name: Setup · pick GUI scripts
    needs: dev-image
    if: inputs.gui_scripts != '' || inputs.from_run != ''
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      sha: ${{ steps.resolve.outputs.sha }}
      ref: ${{ steps.resolve.outputs.ref }}
      run: ${{ steps.resolve.outputs.run }}
      artifact: ${{ steps.resolve.outputs.artifact }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Resolve scripts and AppImage
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GUI_SCRIPTS: ${{ inputs.gui_scripts }}
          FROM_RUN: ${{ inputs.from_run }}
          GUI_REF: ${{ inputs.gui_ref }}
          GUI_UPLOAD_SLOTS: 16
          APPIMAGE: ${{ inputs.appimage }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${GUI_SCRIPTS// /}" ]]; then
            echo "::error::from_run needs gui_scripts; it skips the build, so there is nothing else to do"
            exit 1
          fi
          if [[ -n "$GUI_REF" && -z "$FROM_RUN" ]]; then
            echo "::error::gui_ref only applies with from_run"
            exit 1
          fi
          matrix='[]'
          for script in $GUI_SCRIPTS; do
            if ! [[ "$script" =~ ^Tests/gui/[A-Za-z0-9_][A-Za-z0-9_.-]*\.py$ ]]; then
              echo "::error::gui_scripts entry '$script' is not a Tests/gui/<name>.py path"
              exit 1
            fi
            matrix=$(jq -c --arg s "$script" --arg n "$(basename "$script" .py)" \
              '. + [{script: $s, name: $n}] | unique_by(.name)' <<<"$matrix")
          done
          # Round-robin into at most 4 groups, so runner slots stay free for other gates. Each
          # group job has GUI_UPLOAD_SLOTS upload steps, one per script, which keep the per-script
          # artifact names; a list too long for 4 groups gets more groups instead.
          count=$(jq length <<<"$matrix")
          groups=$(( count < 4 ? count : 4 ))
          if (( count > 4 * GUI_UPLOAD_SLOTS )); then
            groups=$(( (count + GUI_UPLOAD_SLOTS - 1) / GUI_UPLOAD_SLOTS ))
          fi
          matrix=$(jq -c --argjson g "$groups" '
            [to_entries | group_by(.key % $g)[] | map(.value)]
            | to_entries
            | map({name: "group \(.key + 1) of \($g)",
                   scripts: (.value | map(.script)),
                   names: (.value | map(.name))})' <<<"$matrix")
          if [[ "$(jq --argjson n "$GUI_UPLOAD_SLOTS" '[.[] | select((.names | length) > $n)] | length' <<<"$matrix")" -gt 0 ]]; then
            echo "::error::a GUI group has more than $GUI_UPLOAD_SLOTS scripts, the number of upload steps in the gui job"
            exit 1
          fi
          if [[ -n "$FROM_RUN" ]]; then
            if ! [[ "$FROM_RUN" =~ ^[0-9]+$ ]]; then
              echo "::error::from_run '$FROM_RUN' is not a run id"
              exit 1
            fi
            SHA=$(gh api "repos/$REPO/actions/runs/$FROM_RUN" --jq .head_sha)
            RUN_ID="$FROM_RUN"
            artifact="natron-$PRESET-$SHA"
            available=$(gh api --paginate "repos/$REPO/actions/runs/$FROM_RUN/artifacts" \
              --jq '.artifacts[] | select(.expired | not) | .name')
            if ! grep -qxF "$artifact" <<<"$available"; then
              echo "::error::run $FROM_RUN has no artifact $artifact; its unexpired AppImages: $(grep '^natron-' <<<"$available" | tr '\n' ' ')"
              exit 1
            fi
          else
            if [[ "$APPIMAGE" != true || "$PRESET" == debug ]]; then
              echo "::error::gui_scripts need an AppImage: set appimage and a fast or release preset, or use from_run"
              exit 1
            fi
            artifact="natron-$PRESET-$SHA"
          fi
          {
            echo "matrix=$matrix"
            echo "sha=$SHA"
            echo "ref=${GUI_REF:-$SHA}"
            echo "run=$RUN_ID"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the commit under test
        if: inputs.from_run != ''
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          submodules: false
          lfs: false

      - name: Resolve dev image
        id: image
        env:
          FROM_RUN: ${{ inputs.from_run }}
          IMAGE: ${{ needs.dev-image.outputs.image }}
        run: |
          if [[ -n "$FROM_RUN" && -x tools/ci/local/dev-image-tag.sh ]]; then
            IMAGE=$(tools/ci/local/dev-image-tag.sh)
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # One job per group of scripts (see gui-matrix). The scripts run one after another, each under
  # its own timeout and Xvfb display, and a failing one does not stop the rest of its group.
  gui:
    name: GUI · ${{ matrix.name }}
    needs: [gui-matrix, package]
    if: >-
      !cancelled() && needs.gui-matrix.result == 'success'
      && (inputs.from_run != '' || needs.package.outputs.appimage == 'success')
    runs-on: ubuntu-latest
    # The scripts step is capped at 300 minutes so the always() upload steps keep the rest of
    # the 360-minute job limit.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gui-matrix.outputs.matrix) }}
    container:
      image: ${{ needs.gui-matrix.outputs.image }}
      # The live texture tests export through /dev/shm, which Docker sizes at 64m.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      # The scripts and their fixtures come from the commit the AppImage was built from, or from
      # gui_ref when given.
      - name: Checkout the commit under test
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ needs.gui-matrix.outputs.ref }}
          submodules: false
          lfs: false

      # Only the LFS fixtures the group's scripts name are fetched, so most groups download few.
      - name: List LFS fixtures the scripts use
        id: lfs
        env:
          SCRIPTS: ${{ join(matrix.scripts, ' ') }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
          include=()
          while IFS= read -r path; do
            for script in $SCRIPTS; do
              if [[ -f "$script" ]] && grep -qF "$(basename "$path")" "$script"; then
                include+=("$path")
                break
              fi
            done
          done < <(git lfs ls-files -n)
          echo "include=$(IFS=,; echo "${include[*]}")" >> "$GITHUB_OUTPUT"

      # Restore only: a save here would store a partial object set under the full set's key.
      - name: Restore LFS objects
        if: steps.lfs.outputs.include != ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS fixtures
        if: steps.lfs.outputs.include != ''
        env:
          INCLUDE: ${{ steps.lfs.outputs.include }}
        run: |
          git lfs install --local
          git lfs pull --include "$INCLUDE"

      - name: Download AppImage from the package job
        uses: actions/download-artifact@v7.0.0
        with:
          name: ${{ needs.gui-matrix.outputs.artifact }}
          run-id: ${{ needs.gui-matrix.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: gui-appimage

      # Each script's output, its exit status in exit-status included, goes to
      # build/gui-out/<name>/, which build.sh reads its result from.
      - name: Run the group's scripts
        timeout-minutes: 300
        env:
          SCRIPTS: ${{ join(matrix.scripts, ' ') }}
          GUI_TEST_SCREEN_SIZE: 1920x1080
          GUI_TEST_TIMEOUT: 900
          SCRIPT_TIMEOUT: 1500
          ARTIFACT: ${{ needs.gui-matrix.outputs.artifact }}
        run: |
          set -u
          appimage=$(find gui-appimage -name '*.AppImage' -print -quit)
          if [[ -z "$appimage" ]]; then
            echo "::error::no AppImage in $ARTIFACT"
            exit 1
          fi
          failed=()
          display=79
          for script in $SCRIPTS; do
            name=$(basename "$script" .py)
            out="$GITHUB_WORKSPACE/build/gui-out/$name"
            mkdir -p "$out"
            echo "::group::$script"
            NATRON_GUI_TEST_OUT="$out" GUI_TEST_DISPLAY="$display" \
              timeout -k 30 "$SCRIPT_TIMEOUT" Tests/gui/run-gui-test.sh "$script" "$appimage" 2>&1 \
              | tee "$out/run.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            echo "$rc" > "$out/exit-status"
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::$script failed (exit $rc)"
              failed+=("$script")
            else
              echo "$script passed"
            fi
            display=$((display + 1))
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi

      # One upload step per script slot; GUI_UPLOAD_SLOTS in gui-matrix must equal the number of
      # steps below, and gui-matrix fails a group with more names than that.
      - name: Upload GUI output · ${{ matrix.names[0] }}
        if: always() && matrix.names[0]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[0] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[0] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[1] }}
        if: always() && matrix.names[1]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[1] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[1] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[2] }}
        if: always() && matrix.names[2]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[2] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[2] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[3] }}
        if: always() && matrix.names[3]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[3] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[3] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[4] }}
        if: always() && matrix.names[4]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[4] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[4] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[5] }}
        if: always() && matrix.names[5]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[5] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[5] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[6] }}
        if: always() && matrix.names[6]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[6] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[6] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[7] }}
        if: always() && matrix.names[7]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[7] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[7] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[8] }}
        if: always() && matrix.names[8]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[8] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[8] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[9] }}
        if: always() && matrix.names[9]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[9] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[9] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[10] }}
        if: always() && matrix.names[10]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[10] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[10] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[11] }}
        if: always() && matrix.names[11]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[11] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[11] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[12] }}
        if: always() && matrix.names[12]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[12] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[12] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[13] }}
        if: always() && matrix.names[13]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[13] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[13] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[14] }}
        if: always() && matrix.names[14]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[14] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[14] }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GUI output · ${{ matrix.names[15] }}
        if: always() && matrix.names[15]
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-${{ matrix.names[15] }}-${{ env.PRESET }}-${{ needs.gui-matrix.outputs.sha }}
          path: build/gui-out/${{ matrix.names[15] }}
          if-no-files-found: warn
          retention-days: 7

      # The commit under test may predate the summary script.
      - name: Job summary
        if: always()
        env:
          SCRIPTS: ${{ join(matrix.scripts, ' ') }}
          TESTED_SHA: ${{ needs.gui-matrix.outputs.sha }}
        run: |
          if [[ -x tools/ci/summary.sh ]]; then
            for script in $SCRIPTS; do
              name=$(basename "$script" .py)
              status_file="build/gui-out/$name/exit-status"
              if [[ ! -f "$status_file" ]]; then
                result=missing
              elif [[ "$(cat "$status_file")" == 0 ]]; then
                result=success
              else
                result="failure (exit $(cat "$status_file"))"
              fi
              tools/ci/summary.sh gui "$script" "$result" "gui-$name-$PRESET-$TESTED_SHA"
            done
          fi
