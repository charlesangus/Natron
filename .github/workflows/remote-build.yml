name: Remote build

run-name: remote-build ${{ inputs.preset || 'fast' }} ${{ inputs.token }}${{ inputs.cmake_args != '' && format(' cmake:{0}', inputs.cmake_args) || '' }}

on:
  # A push run builds fast with no tests and no AppImage; it exists to
  # keep main's fast ccache entry warm for branch runs to fall back on.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preset:
        description: 'Build preset'
        required: true
        type: choice
        options:
          - fast
          - release
          - debug
        default: fast
      tests:
        description: 'Run the ctest suite and smoke test'
        required: true
        type: boolean
        default: false
      record_goldens:
        description: 'Record the native golden renders (needs tests) and upload them'
        required: false
        type: boolean
        default: false
      appimage:
        description: 'Package and upload an AppImage (ignored for debug, which cannot be packaged in the container)'
        required: true
        type: boolean
        default: true
      shuffle_seeds:
        description: 'Comma-separated gtest shuffle seeds (needs tests): each ctest leg runs once unshuffled, then once per seed'
        required: false
        type: string
        default: ''
      cmake_args:
        description: 'Extra CMake arguments, space-separated'
        required: false
        type: string
        default: ''
      token:
        description: 'Opaque marker echoed into the run name so a script can find this run'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CI: 'True'
  PYTHON_VERSION: '3.13'
  OCIO_CONFIG_VERSION: 2.5
  NATRON_IN_CONTAINER: 1
  PRESET: ${{ inputs.preset || 'fast' }}

jobs:
  dev-image:
    name: dev image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/dev-image.yml

  # Builds once; the ctest legs below run off the build tree it uploads.
  remote-build:
    name: remote-build
    needs: dev-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: ${{ (inputs.preset || 'fast') == 'fast' && '2G' || '3G' }}
      # One compile per vCPU of the hosted runner; build.sh's default of 3 suits the dev machine.
      NATRON_BUILD_JOBS: 4
    outputs:
      tree: ${{ steps.upload_tree.outcome }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The primary key ends in run_id so every run saves a fresh entry
      # (a save under an existing exact key is a silent no-op); hits come
      # from the restore-keys prefixes.
      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ env.PRESET }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ env.PRESET }}-${{ github.head_ref || github.ref_name }}-
            ccache-linux-${{ env.PRESET }}-main-
            ${{ env.PRESET == 'debug' && 'ccache-linux-main-' || '' }}

      - name: Cache test assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/TestPlugins
            build/assets/CImg
            build/assets/rawspeed
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      - name: Build
        id: build
        env:
          WITH_TESTS: ${{ inputs.tests && '1' || '' }}
          CMAKE_ARGS: ${{ inputs.cmake_args }}
        run: |
          extra=()
          for word in $CMAKE_ARGS; do
            extra+=(--cmake-arg "$word")
          done
          tools/ci/local/build.sh "$PRESET" ${WITH_TESTS:+--tests} "${extra[@]}" --no-ccache-stats

      # An extra-argument build lands in build/<preset>-<hash>, but test.sh and the packaging steps
      # look in build/<preset>; a relative link makes the real tree answer to that name.
      - name: Link build tree
        if: steps.build.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.build.outputs.build_dir }}
        run: |
          if [[ "$(basename "$BUILD_DIR")" != "$PRESET" ]]; then
            ln -sfn "$(basename "$BUILD_DIR")" "build/$PRESET"
          fi

      # Runs before the ctest legs so they replay the references just recorded.
      - name: Record native goldens
        if: inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
        timeout-minutes: 15
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          NATRON_RENDER_SCHEDULER: legacy
          NATRON_GOLDEN_RECORD_DIR: ${{ github.workspace }}/Tests/fixtures/native-golden
          OFX_PLUGIN_PATH: ${{ github.workspace }}/build/assets/Plugins:${{ github.workspace }}/build/assets/TestPlugins
        working-directory: build/${{ env.PRESET }}
        run: |
          set -o pipefail
          mkdir -p "$NATRON_GOLDEN_RECORD_DIR"
          rc=0
          xvfb-run --auto-servernum ctest -R '^NativeGoldenTest$' --timeout 300 --output-on-failure || rc=$?
          test -f "$NATRON_GOLDEN_RECORD_DIR/STAMP" || rc=1
          exit "$rc"

      # Straight after recording, so that a later leg that fails, times out or is cancelled cannot
      # lose the references; a node whose case failed is simply absent from them.
      - name: Upload native goldens
        if: >-
          !cancelled() && inputs.tests && inputs.record_goldens && steps.build.outcome == 'success'
          && hashFiles('Tests/fixtures/native-golden/STAMP') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-goldens-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-golden
          if-no-files-found: error
          retention-days: 7

      # A tar because artifacts drop the executable bit. Object files and static archives are
      # only build inputs, and Testing/ holds this job's golden-recording run. An extra-argument
      # build packs its real tree next to the build/<preset> link, which tar stores as a link.
      - name: Pack build tree
        if: inputs.tests && !cancelled() && steps.build.outcome == 'success'
        env:
          BUILD_DIR: ${{ steps.build.outputs.build_dir }}
        run: |
          trees=("build/$PRESET")
          real="build/$(basename "$BUILD_DIR")"
          if [[ "$real" != "build/$PRESET" ]]; then
            trees+=("$real")
          fi
          tar -cf build-tree.tar --exclude='*.o' --exclude='*.a' --exclude="$real/Testing" "${trees[@]}"
          ls -lh build-tree.tar

      - name: Upload build tree
        id: upload_tree
        if: inputs.tests && !cancelled() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-tree-${{ env.PRESET }}
          path: build-tree.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

      # Gated on the build rather than on test success: a red test leg
      # should not withhold the binary someone is trying to inspect.
      # check-startup.sh runs inside make-appimage.sh.
      - name: Stage bundle
        if: inputs.appimage && inputs.preset != 'debug' && !cancelled() && steps.build.outcome == 'success'
        run: tools/release/stage-bundle.sh "build/$PRESET" /tmp/natron-stage

      - name: Create AppImage
        if: inputs.appimage && inputs.preset != 'debug' && !cancelled() && steps.build.outcome == 'success'
        run: tools/release/make-appimage.sh /tmp/natron-stage /tmp/artifacts

      - name: Upload AppImage
        if: inputs.appimage && inputs.preset != 'debug' && !cancelled() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: natron-${{ env.PRESET }}-${{ github.sha }}
          path: /tmp/artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: ccache stats
        if: always()
        run: ccache -s

  ctest:
    name: ctest (${{ matrix.scheduler }})
    needs: [dev-image, remote-build]
    if: >-
      !cancelled() && inputs.tests && needs.remote-build.outputs.tree == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheduler: [legacy, taskgraph]
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5.0.1
        with:
          submodules: recursive
          lfs: false

      # LFS objects come from the cache and download only on a miss. The workspace
      # is not owned by the container's root user, so git needs it marked safe.
      - name: List LFS objects
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        uses: actions/cache@v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs install --local
          git lfs pull

      # The build job saved both entries, so these hit and fetch-assets.sh is a stamp check.
      - name: Restore test assets
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            build/assets/Plugins
            build/assets/TestPlugins
            build/assets/CImg
            build/assets/rawspeed
          key: assets-linux-${{ hashFiles('tools/ci/local/fetch-assets.sh') }}

      - name: Fetch test assets
        run: tools/ci/local/fetch-assets.sh

      # Missing when recording failed outright; the leg then replays the committed references,
      # as it would have in the build job.
      - name: Download native goldens
        if: inputs.record_goldens
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: native-goldens-${{ env.PRESET }}-${{ github.sha }}
          path: Tests/fixtures/native-golden

      - name: Download build tree
        uses: actions/download-artifact@v7.0.0
        with:
          name: build-tree-${{ env.PRESET }}

      # The tree's absolute paths hold because every job's workspace is mounted at the same path.
      - name: Unpack build tree
        run: |
          tar -xf build-tree.tar
          rm build-tree.tar

      # An absent cache entry means the option's default, ON. Some suites test only that the
      # variable is set, so a GPU-off tree must leave it unset rather than set it to 0.
      - name: Detect GPU build
        run: |
          value=$(sed -n 's/^NATRON_GPU:[A-Z]*=//p' "build/$PRESET/CMakeCache.txt")
          case "${value^^}" in
            OFF|FALSE|NO|N|0|IGNORE|NOTFOUND|*-NOTFOUND) ;;
            *) echo "NATRON_TEST_REQUIRE_GPU=1" >> "$GITHUB_ENV" ;;
          esac

      # Without the step bound, a suite that outlives ctest's own per-suite timeout holds the job
      # until GitHub's six-hour limit.
      - name: Run ctest suite (${{ matrix.scheduler }} scheduler)
        timeout-minutes: ${{ inputs.shuffle_seeds == '' && 30 || 120 }}
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          SHUFFLE_SEEDS: ${{ inputs.shuffle_seeds }}
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          # One suite per vCPU of the hosted runner; 1 restores the serial `ctest -V` run.
          NATRON_CTEST_JOBS: 4
        run: |
          set -o pipefail
          if [[ -n "$SHUFFLE_SEEDS" ]]; then
            seed_list=${SHUFFLE_SEEDS//,/ }
            seed_count=$(wc -w <<<"$seed_list")
            if (( seed_count > 5 )); then
              echo "::error::shuffle_seeds has $seed_count seeds; at most 5 fit the 120-minute ctest step timeout"
              exit 1
            fi
          fi
          grep -m1 'model name' /proc/cpuinfo; nproc; grep -o -w 'avx512f' /proc/cpuinfo | head -1 || true
          mkdir -p ctest-logs
          rc=0
          tools/ci/local/test.sh ctest "$PRESET" 2>&1 | tee "ctest-logs/ctest-${{ matrix.scheduler }}.log" || rc=$?
          # Every seed runs even after a failure, so one dispatch reports all of them; the leg
          # fails if any run did.
          for seed in ${SHUFFLE_SEEDS//,/ }; do
            echo "== shuffled ctest run, seed $seed =="
            GTEST_SHUFFLE=1 GTEST_RANDOM_SEED="$seed" tools/ci/local/test.sh ctest "$PRESET" 2>&1 \
              | tee "ctest-logs/ctest-${{ matrix.scheduler }}-seed${seed}.log" || rc=$?
          done
          exit "$rc"

      - name: Python bindings smoke test (${{ matrix.scheduler }} scheduler)
        if: success() || failure()
        env:
          NATRON_RENDER_SCHEDULER: ${{ matrix.scheduler }}
          NATRON_SMOKE_OUTPUT_DIR: ${{ github.workspace }}/build/smoke-reference
        run: tools/ci/local/test.sh smoke "$PRESET"

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-log-${{ matrix.scheduler }}-${{ env.PRESET }}-${{ github.sha }}
          path: ctest-logs/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload smoke renders
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smoke-render-${{ matrix.scheduler }}-${{ env.PRESET }}-${{ github.sha }}
          path: build/smoke-reference
          if-no-files-found: ignore
          retention-days: 1

  # Gathers both legs' logs into the one artifact tools/ci/remote/build.sh downloads, and holds the
  # byte-for-byte comparison of the two schedulers' smoke renders, which spans both legs.
  results:
    name: results
    needs: [remote-build, ctest]
    if: always() && inputs.tests
    runs-on: ubuntu-latest
    steps:
      - name: Download ctest logs
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: ctest-log-*-${{ env.PRESET }}-${{ github.sha }}
          merge-multiple: true
          path: ctest-logs

      - name: Upload ctest logs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ctest-logs-${{ env.PRESET }}-${{ github.sha }}
          path: ctest-logs/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Require every ctest leg to pass
        env:
          RESULT: ${{ needs.ctest.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "ctest matrix result: $RESULT" >&2
            exit 1
          fi

      - name: Download smoke renders
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: smoke-render-*-${{ env.PRESET }}-${{ github.sha }}
          path: smoke-renders

      - name: Compare smoke renders across schedulers
        env:
          SUFFIX: ${{ env.PRESET }}-${{ github.sha }}
        run: |
          test -d "smoke-renders/smoke-render-legacy-$SUFFIX"
          test -d "smoke-renders/smoke-render-taskgraph-$SUFFIX"
          diff -r "smoke-renders/smoke-render-legacy-$SUFFIX" "smoke-renders/smoke-render-taskgraph-$SUFFIX"
