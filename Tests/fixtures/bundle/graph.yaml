format: natron-project
formatVersion: 1
knobs:
  frameRange: [1, 50]
formats:
  - {name: "BundleSquare", rect: [0, 0, 64, 64], par: 1}
layers:
  zdepth: {label: "Depth", channelsLabel: "Z", channels: ["Z"], origin: 1}
timeline: {current: 7}
nodes:
  Blur1:
    plugin: "net.sf.cimg.CImgBlur"
    version: [5, 1]
    knobs:
      size: [{expr: "Grade1.multiply.getValue(1) * 2", hasRet: false}, {value: 4, linkGroup: "Blur1.size.1"}]
    inputs: {Source: "Grade1"}
  Constant1:
    plugin: "net.sf.openfx.ConstantPlugin"
    version: [2, 0]
    knobs:
      color: [0.25, 0.5, 0.75, 1]
  Grade1:
    plugin: "net.sf.openfx.GradePlugin"
    version: [3, 0]
    knobs:
      multiply: [{curve: [L, 1, 1, 10, 2.5, X, 20, 0.75, 0.125, -0.25]}, 1.5, 1, 1]
    inputs: {Source: "Constant1"}
  Group1:
    plugin: "fr.inria.built-in.Group"
    version: [1, 0]
    # A group's input is labelled after its Input node, less a leading "Input".
    inputs: {"1": "Blur1"}
    children:
      Blur2:
        plugin: "net.sf.cimg.CImgBlur"
        version: [5, 1]
        knobs:
          size: [{value: 4, linkGroup: "Blur1.size.1"}, 3]
        inputs: {Source: "Input1"}
      Input1:
        plugin: "fr.inria.built-in.Input"
        version: [1, 0]
      Output1:
        plugin: "fr.inria.built-in.Output"
        version: [1, 0]
        inputs: {Source: "Blur2"}
