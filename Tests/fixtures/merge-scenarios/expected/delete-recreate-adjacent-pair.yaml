# Hand-written: the correspondences and conflicts a correct merge of delete-recreate-adjacent-pair/ gives.
description: >-
  The artist deletes Grade1 and Blur1 and makes Grade2 and Blur2 in their place, TplIn -> Grade2 ->
  Blur2 -> Merge1.B; the supervisor sets Grade1's gamma and Blur1's size. Neither new node has all
  its neighbours matched, so neither stands for a template node: both template nodes come back with
  the supervisor's changes, each with a delete-modify conflict.
merges:
  - template: grade_tpl
    base_mine:
      TplIn: TplIn
      Grade1: ~
      Blur1: ~
      Constant1: Constant1
      Merge1: Merge1
      ColorCorrect1: ColorCorrect1
      TplOut: TplOut
    base_theirs:
      TplIn: TplIn
      Grade1: Grade1
      Blur1: Blur1
      Constant1: Constant1
      Merge1: Merge1
      ColorCorrect1: ColorCorrect1
      TplOut: TplOut
    scope: [TplIn, Grade2, Blur2, Constant1, Merge1, ColorCorrect1, TplOut]
    conflicts:
      - {node: Grade1, kind: delete-modify}
      - {node: Blur1, kind: delete-modify}
notes: >-
  Adoption needs every neighbour matched, so a recreated pair is never adopted from its own guesses:
  guessing both at once could adopt the wrong node for each.
