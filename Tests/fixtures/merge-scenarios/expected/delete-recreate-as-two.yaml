# Hand-written: the correspondences and conflicts a correct merge of delete-recreate-as-two/ gives.
description: >-
  The artist deletes Grade1 and puts two Grades, GradeA -> GradeB, in its place; the supervisor sets
  Grade1's gamma. Neither new Grade alone stands for Grade1, so Grade1 is deleted in mine and modified
  in theirs.
merges:
  - template: grade_tpl
    base_mine:
      TplIn: TplIn
      Grade1: ~
      Blur1: Blur1
      Constant1: Constant1
      Merge1: Merge1
      ColorCorrect1: ColorCorrect1
      TplOut: TplOut
    base_theirs:
      TplIn: TplIn
      Grade1: Grade1
      Blur1: Blur1
      Constant1: Constant1
      Merge1: Merge1
      ColorCorrect1: ColorCorrect1
      TplOut: TplOut
    scope: [TplIn, Blur1, Constant1, Merge1, ColorCorrect1, TplOut, GradeA, GradeB]
    conflicts:
      - {node: Grade1, kind: delete-modify}
