# Hand-written: the correspondences and conflicts a correct merge of reconnect/ gives.
description: >-
  Both sides reconnect Merge1.A away from Constant1: the artist to ArtistMatte, the supervisor to
  Constant2. An input conflict on Merge1.A; Constant1 is left unconnected on both sides.
merges:
  - template: grade_tpl
    base_mine:
      TplIn: TplIn
      Grade1: Grade1
      Blur1: Blur1
      Constant1: Constant1
      Merge1: Merge1
      ColorCorrect1: ColorCorrect1
      TplOut: TplOut
    base_theirs:
      TplIn: TplIn
      Grade1: Grade1
      Blur1: Blur1
      Constant1: Constant1
      Merge1: Merge1
      ColorCorrect1: ColorCorrect1
      TplOut: TplOut
    scope: [TplIn, Grade1, Blur1, Constant1, Merge1, ColorCorrect1, TplOut]
    conflicts:
      - {node: Merge1, input: A, kind: input}
